<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stretchy Maps</title>
<style>
  :root{
    --bg:#dfe9ef;
    --text:#1c1b19;
    --text-dim:#5c5a54;
    --border:#ffffff;
    --missing:#c9c7c0;
    --tip:#ffffffee;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121820;
      --text:#e8e6e1;
      --text-dim:#9b988f;
      --border:#121820;
      --missing:#3a3a40;
      --tip:#22252bee;
    }
  }
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .head{position:fixed;left:16px;top:12px;pointer-events:none;max-width:calc(100% - 290px);}
  h1{font-size:20px;font-weight:600;margin:0;}
  .sub{font-size:13px;color:var(--text-dim);margin:4px 0 0;}
  #legend{margin-top:8px;font-size:12px;color:var(--text-dim);}
  #legend .bar{width:220px;height:10px;border-radius:3px;margin:3px 0;}
  #legend .ends{width:220px;display:flex;justify-content:space-between;}
  #status{position:fixed;left:16px;bottom:12px;font-size:12px;color:var(--text-dim);pointer-events:none;}
  #tip{position:fixed;pointer-events:none;background:var(--tip);border-radius:6px;padding:6px 9px;font-size:13px;
    box-shadow:0 2px 8px #0003;display:none;white-space:nowrap;}
  #tip b{display:block;}
  #tip span{color:var(--text-dim);font-size:12px;}
  @media(max-width:600px){.head{max-width:calc(100% - 32px);top:auto;bottom:36px;}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="head">
  <h1 id="title">Stretchy Maps</h1>
  <p class="sub" id="subtitle"></p>
  <div id="legend"></div>
</div>
<div id="status" role="status">Loading&hellip;</div>
<div id="tip"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
