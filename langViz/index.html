<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>langViz</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0806; overflow: hidden; }
  #viz {
    display: block; width: 100vw; height: 100vh;
    cursor: grab; touch-action: none;
  }
  #viz:active { cursor: grabbing; }
  /* tiny unobtrusive hint, fades after a few seconds */
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    color: rgba(180,168,148,0.45); font: 12px ui-monospace, Menlo, monospace;
    pointer-events: none; transition: opacity 1s ease; opacity: 1;
  }
  #hint.gone { opacity: 0; }
  /* ---- stage rail: named stops along the spine the camera can fly to ----
     Fitting the whole ~6500-unit-wide network on screen forces a ~0.25 scale, so
     the overview can only ever be an establishing shot. The rail is how you get
     to a framing that actually fills the screen. */
  #stages {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    z-index: 6; display: flex; gap: 5px; align-items: center;
    max-width: 92vw; overflow-x: auto; scrollbar-width: none;
    padding: 5px 7px; border-radius: 9px;
    background: rgba(12,10,8,0.72); border: 1px solid rgba(150,135,105,0.24);
    font: 11px ui-monospace, Menlo, monospace;
  }
  #stages::-webkit-scrollbar { display: none; }
  #stages button {
    flex: 0 0 auto; cursor: pointer; white-space: nowrap;
    padding: 4px 9px; border-radius: 6px; font: inherit;
    background: transparent; border: 1px solid transparent;
    color: rgba(196,184,162,0.72);
  }
  #stages button:hover { color: rgba(240,224,190,0.95); background: rgba(150,135,105,0.14); }
  #stages button.on {
    color: rgba(18,14,10,1); font-weight: 600;
    background: rgba(245,200,120,0.92); border-color: rgba(255,224,150,0.9);
  }
  #stages .sep { flex: 0 0 auto; width: 1px; height: 15px; background: rgba(150,135,105,0.28); }
  /* ---- logit-lens rail: the model's running next-token guess at every depth ----
     Screen space, always readable, never needs zooming. It lives on the RIGHT
     because the per-stage camera framings are height-limited (the network is tall
     and narrow per block), so horizontal room is the space actually going spare. */
  #lensRail {
    position: fixed; right: 13px; top: 50%; transform: translateY(-50%);
    z-index: 4; width: 202px; pointer-events: none; box-sizing: content-box;
    display: flex; flex-direction: column; gap: 4px;
    font: 11px ui-monospace, Menlo, monospace;
    padding: 7px 8px 6px; border-radius: 10px;
    background: rgba(9,8,6,0.965); border: 1px solid rgba(150,135,105,0.26);
    box-shadow: 0 6px 26px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 0.6s ease;
  }
  #lensRail.on { opacity: 1; }
  #lensRail .lr-cap {
    color: rgba(168,158,138,0.8); font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; text-align: center; padding-bottom: 1px;
  }
  #lensRail .lr-foot {
    color: rgba(190,178,156,0.75); font-size: 10px; text-align: center;
    padding-top: 2px; min-height: 13px;
  }
  #lensRail .lr-foot b { color: rgba(255,224,150,0.95); font-weight: 600; }
  #lensRail .lr-cell {
    position: relative; padding: 3px 0 4px; border-radius: 6px;
    background: rgba(10,9,7,0.8); border: 1px solid rgba(150,135,105,0.22);
    border-left: 3px solid rgba(150,135,105,0.22);
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  /* the wave sweeping the network lights each depth in turn */
  #lensRail .lr-cell.lit { background: rgba(20,17,12,0.92); border-color: rgba(200,178,130,0.5); }
  /* the depth where the final answer FIRST becomes the top guess */
  #lensRail .lr-cell.decided { border-left-color: rgba(255,200,90,0.95); }
  #lensRail .lr-h {
    font-size: 9px; color: rgba(186,176,156,0.72); padding: 0 7px 2px;
    display: flex; justify-content: space-between;
  }
  #lensRail .lr-h .lr-tag { color: rgba(255,200,90,0.9); }
  #lensRail .lr-row {
    position: relative; display: flex; justify-content: space-between;
    font-size: 12.5px; line-height: 1.3; padding: 0 7px;
    color: rgba(214,200,172,0.85);
  }
  #lensRail .lr-bar {
    position: absolute; left: 3px; top: 0; bottom: 0; z-index: 0;
    background: rgba(245,150,34,0.22); border-radius: 2px;
  }
  #lensRail .lr-tok, #lensRail .lr-pct { position: relative; z-index: 1; }
  #lensRail .lr-tok { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lensRail .lr-pct { padding-left: 6px; }
  #lensRail .lr-row.locked { color: rgba(255,242,205,1); font-weight: 600; }
  #lensRail .lr-row.locked .lr-bar { background: rgba(255,214,130,0.3); }
  /* ---- attribution panel: which part of the model moved the produced token ----
     Shares the right rail with the lens; they answer "what did it guess" and
     "what made it guess that" and are read together. */
  #lensRail .lr-div { height: 1px; background: rgba(150,135,105,0.22); margin: 5px 1px 4px; }
  #lensRail .at-cap {
    color: rgba(168,158,138,0.8); font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; text-align: center; padding-bottom: 3px;
  }
  #lensRail .at-cap b { color: rgba(255,224,150,0.95); font-weight: 600; text-transform: none; }
  #lensRail .at-row {
    position: relative; display: flex; align-items: center; gap: 5px;
    font-size: 11px; line-height: 1.45; color: rgba(206,194,170,0.9);
  }
  #lensRail .at-name { flex: 0 0 76px; white-space: nowrap; }
  /* diverging track: bar grows right for a push toward the token, left for away */
  #lensRail .at-track { position: relative; flex: 1 1 auto; height: 9px; background: rgba(70,64,52,0.5); border-radius: 2px; }
  #lensRail .at-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  #lensRail .at-tick { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(210,200,180,0.5); }
  #lensRail .at-val { flex: 0 0 38px; text-align: right; font-variant-numeric: tabular-nums; }
  #lensRail .at-foot { color: rgba(160,150,132,0.75); font-size: 9.5px; text-align: center; padding-top: 3px; }
  /* no room for the rail on a narrow window — renderer.js reclaims the space */
  @media (max-width: 759px) { #lensRail { display: none; } }
  /* neuron inspector tooltip: what an MLP/GELU unit fires on, on hover */
  #neuronTip {
    position: fixed; z-index: 5; pointer-events: none; max-width: 290px;
    padding: 7px 10px; border-radius: 7px; display: none;
    font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: rgba(12,10,8,0.94); border: 1px solid rgba(150,135,105,0.32);
    color: rgba(214,202,180,0.95); box-shadow: 0 5px 20px rgba(0,0,0,0.55);
  }
  #neuronTip .nt-h   { color: rgba(245,210,150,0.95); font-weight: 600; margin-bottom: 3px; }
  #neuronTip .nt-t   { color: rgba(238,228,208,0.96); }
  #neuronTip .nt-ctx { color: rgba(172,162,142,0.9); font-style: italic; margin-top: 4px; }
  #neuronTip .nt-dim { color: rgba(150,140,120,0.72); margin-top: 4px; font-size: 11px; }
  /* The model's input window + the token it just produced, with attention arcs
     drawn (on the #arcs overlay canvas) from the new word back to what it looked
     at. One box: the reading text and the attention view are the same thing. */
  #io {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    max-width: 94vw; box-sizing: border-box; padding: 7px 16px 48px;
    border-radius: 10px; background: rgba(12,10,8,0.55);
    border: 1px solid rgba(150,135,105,0.22);
    color: rgba(214,202,180,0.92); pointer-events: none; z-index: 3;
  }
  /* prompt box: the piece stops being a loop you watch and becomes something
     you can ask questions of. #io is pointer-events:none so the network stays
     draggable underneath; only this row takes input. */
  #promptBar {
    display: flex; align-items: center; gap: 7px; pointer-events: auto;
    margin-bottom: 6px;
  }
  #promptBar label {
    flex: 0 0 auto; color: rgba(158,148,128,0.7);
    font: 10px ui-monospace, Menlo, monospace;
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  #prompt {
    flex: 1 1 auto; min-width: 0; box-sizing: border-box;
    padding: 4px 8px; border-radius: 5px;
    background: rgba(0,0,0,0.35); color: rgba(245,200,120,0.95);
    border: 1px solid rgba(150,135,105,0.3);
    font: 13px ui-monospace, Menlo, monospace;
  }
  #prompt:focus {
    outline: none; border-color: rgba(245,200,120,0.75);
    background: rgba(0,0,0,0.6);
  }
  #promptHint {
    flex: 0 0 auto; color: rgba(158,148,128,0.65);
    font: 10px ui-monospace, Menlo, monospace; white-space: nowrap;
  }
  #promptHint.armed { color: rgba(245,200,120,0.95); }
  /* transport: generation is a clock, and you need to be able to stop it to
     read the lens rail or hover a neuron before the next token overwrites it */
  #promptBar button {
    flex: 0 0 auto; cursor: pointer; pointer-events: auto;
    padding: 4px 9px; border-radius: 5px;
    font: 11px ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,0.35); color: rgba(206,196,176,0.9);
    border: 1px solid rgba(150,135,105,0.3);
  }
  #promptBar button:hover { color: rgba(245,225,190,1); border-color: rgba(190,172,136,0.6); }
  #promptBar button.armed {
    background: rgba(245,200,120,0.92); border-color: rgba(255,224,150,0.9);
    color: rgba(18,14,10,1); font-weight: 600;
  }
  #io .tag {
    display: block; margin-bottom: 5px; text-align: center;
    color: rgba(158,148,128,0.7); font: 10px ui-monospace, Menlo, monospace;
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  #io .tag b { color: rgba(245,200,120,0.9); }
  /* the token row — one line, scaled to fit so arcs align to real word positions */
  #strip {
    position: relative; z-index: 1; white-space: nowrap; text-align: center;
    font: 14px/1.5 ui-monospace, Menlo, monospace;
  }
  #strip .p { color: rgba(245,200,120,0.95); }   /* prompt — the input seed */
  #strip .g { color: rgba(206,196,176,0.92); }   /* generated so far */
  #strip .n {                                    /* the token just produced */
    color: #0a0806; background: rgba(255,224,150,0.96);
    border-radius: 3px; padding: 0 2px;
  }
  /* attention arcs, drawn behind the text in the padding lane below it */
  #arcs { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; }

  /* ---- world DOM layer: text/boxes that pan & zoom WITH the canvas ----
     #worldInner gets the same translate+scale transform the canvas uses, so its
     children — positioned in world coordinates — line up with the drawn network
     and scale as you zoom. CSS handles the layout the canvas can't. */
  #world { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
  #worldInner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* logit-lens chip: the model's running guess at one depth of the residual stream */
  .lens {
    position: absolute; width: 210px; box-sizing: border-box;
    padding: 5px 0 4px; border-radius: 6px;
    background: rgba(10,9,7,0.82); border: 1px solid rgba(150,135,105,0.3);
    font-family: ui-monospace, Menlo, monospace; color: rgba(236,216,170,0.9);
  }
  .lens .lhdr { font-size: 9px; color: rgba(190,180,160,0.75); padding: 0 8px 3px; }
  .lens .lrow {
    position: relative; display: flex; justify-content: space-between;
    font-size: 14px; line-height: 1.25; padding: 1px 8px;
  }
  .lens .lbar { position: absolute; left: 4px; top: 1px; bottom: 1px; z-index: 0;
    background: rgba(245,150,34,0.26); border-radius: 2px; }
  .lens .ltok, .lens .lpct { position: relative; z-index: 1; }
  .lens .lrow.locked { color: rgba(255,240,198,1); font-weight: 600; }
  .lens .lrow.locked .lbar { background: rgba(255,224,150,0.32); }
  /* structural labels in the world layer (block titles, branch watermarks, column
     names + glosses, input/output, attention panel + output text). All scale with
     the network and nothing is hidden by zoom. */
  #worldInner .wl {
    position: absolute; white-space: nowrap; transform-origin: 0 0;
    font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.01em;
    text-shadow: 0 1px 5px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.7);
  }
  #worldInner .wl-title    { color: rgba(234,214,174,0.96); font-weight: 600; }
  #worldInner .wl-subtitle { color: rgba(200,186,160,0.5); }
  #worldInner .wl-mark-a     { color: rgba(150,180,220,0.65); font-weight: 600; }
  #worldInner .wl-mark-a-sub { color: rgba(150,180,220,0.42); }
  #worldInner .wl-mark-m     { color: rgba(186,156,216,0.65); font-weight: 600; }
  #worldInner .wl-mark-m-sub { color: rgba(186,156,216,0.42); }
  #worldInner .wl-col   { color: rgba(210,200,180,0.95); }
  #worldInner .wl-gloss { color: rgba(198,188,168,0.74); }
  #worldInner .wl-io     { color: rgba(206,184,142,0.95); font-weight: 600; }
  #worldInner .wl-io-sub { color: rgba(206,184,142,0.5); }
  #worldInner .wl-res   { color: rgba(202,182,142,0.72); }
  #worldInner .wl-attn-cap { color: rgba(200,190,170,0.7); }
  #worldInner .wl-attn-h   { font-weight: 600; }
  #worldInner .wl-attn-tok { color: rgba(238,228,208,0.92); }
  #worldInner .wl-out          { color: rgba(240,212,162,0.92); }
  #worldInner .wl-out.sampled  { color: rgba(255,240,198,1); font-weight: 600; }
  /* zoom-in explainer plates: small wrapped paragraphs that describe one op.
     A dark plate keeps them readable over edges/nodes; they're tiny at the
     overview zoom and meant to be read after zooming into a part. */
  #worldInner .wl-desc {
    width: 150px; box-sizing: border-box; white-space: normal;
    line-height: 1.34; padding: 5px 7px; border-radius: 6px; font-weight: 400;
    color: rgba(208,198,178,0.86); letter-spacing: 0;
    background: rgba(9,8,6,0.85); border: 1px solid rgba(150,135,105,0.26);
    text-shadow: none;
  }
  #worldInner .wl-desc b { color: rgba(245,210,150,0.96); font-weight: 600; }
</style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="world"><div id="worldInner"></div></div>
  <div id="io">
    <div id="promptBar">
      <label for="prompt">prompt</label>
      <input id="prompt" type="text" spellcheck="false" autocomplete="off" />
      <span id="promptHint"></span>
      <button id="btnPlay" type="button" title="pause / resume (space)">pause</button>
      <button id="btnStep" type="button" title="generate one token (.)">step</button>
    </div>
    <span class="tag">model context — <b>prompt</b> + generated · highlighted = newest · arcs = where it just looked</span>
    <div id="strip"></div>
    <canvas id="arcs"></canvas>
  </div>
  <aside id="lensRail" aria-label="logit lens by depth"></aside>
  <nav id="stages" aria-label="network stages"></nav>
  <div id="hint">space pause · . step one token · ← → walk the network · drag to pan · scroll to zoom · hover an MLP neuron</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
