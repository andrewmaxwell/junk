<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Sound Visualizer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none; /* the picture owns drags and pinches */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no callout on a long press */
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        top: max(14px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        display: flex;
        align-items: center;
        flex-wrap: wrap; /* the hint outgrows a phone on its own */
        gap: 8px 12px;
        font:
          13px 'Helvetica Neue',
          Helvetica,
          Arial,
          sans-serif;
        pointer-events: none; /* the whole screen is the button */
      }
      /* Four small buttons in the corner, and nothing else on top of the
         picture. Translucent so the spectrogram shows through them. */
      #controls {
        display: flex;
        gap: 6px;
      }
      .ctl {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        background: rgba(6, 10, 16, 0.55);
        color: rgba(232, 240, 255, 0.8);
        cursor: pointer;
        pointer-events: auto;
      }
      .ctl:hover:not(:disabled) {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.38);
      }
      .ctl:focus-visible {
        outline: 2px solid rgba(120, 180, 255, 0.8);
        outline-offset: 1px;
      }
      .ctl:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .ctl svg {
        width: 14px;
        height: 14px;
      }
      /* Each button carries its idle icon and its active one. */
      .ctl .on-icon,
      .ctl.on .off-icon {
        display: none;
      }
      .ctl.on .on-icon {
        display: block;
      }
      #rec-btn {
        color: #ff5a4a;
      }
      #rec-btn.on {
        border-color: rgba(255, 90, 74, 0.9);
        background: rgba(255, 90, 74, 0.85);
        color: #fff;
      }
      /* Only before there is a picture: what the buttons are for. */
      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(232, 240, 255, 0.45);
        font:
          14px 'Helvetica Neue',
          Helvetica,
          Arial,
          sans-serif;
        pointer-events: none;
      }
      #hint.hide {
        display: none;
      }
      body.dropping::after {
        content: '';
        position: fixed;
        inset: 12px;
        border: 1.5px dashed rgba(232, 240, 255, 0.45);
        border-radius: 10px;
        pointer-events: none;
      }
      /* The readout and the sign that it is about to get sharper, kept
         together so the spinner sits with the numbers rather than out at the
         far end of the row. */
      #readout {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 13px;
      }
      #status {
        color: rgba(232, 240, 255, 0.65);
      }
      #status.rec {
        color: #ff5a4a;
        font-weight: 600;
      }
      /* Turns while the analysis pool is working. A transform animation, so it
         is the compositor that keeps it moving and it does not stop for
         anything the main thread is doing. */
      #busy {
        display: none;
        width: 11px;
        height: 11px;
        border: 2px solid rgba(232, 240, 255, 0.22);
        border-top-color: rgba(232, 240, 255, 0.8);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      #busy.show {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #inspect {
        position: fixed;
        display: none;
        pointer-events: none; /* only the close button takes clicks */
        padding: 9px 12px 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        background: rgba(6, 10, 16, 0.85);
        -webkit-backdrop-filter: blur(7px);
        backdrop-filter: blur(7px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        color: #e8f0ff;
        font:
          12px/1.5 'Helvetica Neue',
          Helvetica,
          Arial,
          sans-serif;
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #inspect.show {
        display: block;
      }
      #inspect-head {
        margin-bottom: 7px;
        padding: 0 20px 6px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }
      #inspect-rows {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 18px;
        margin: 0;
      }
      #inspect-rows dt {
        color: rgba(232, 240, 255, 0.5);
      }
      #inspect-rows dd {
        margin: 0;
        text-align: right;
        white-space: nowrap;
      }
      #inspect-rows dd.none {
        color: rgba(232, 240, 255, 0.5);
      }
      #close {
        position: absolute;
        top: 3px;
        right: 4px;
        width: 19px;
        height: 19px;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: none;
        color: rgba(232, 240, 255, 0.45);
        font:
          16px/1 'Helvetica Neue',
          Helvetica,
          Arial,
          sans-serif;
        cursor: pointer;
        pointer-events: auto;
      }
      #close:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }
      /* Sweeps the viewport while the visible region is playing. */
      #playhead {
        position: fixed;
        display: none;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        pointer-events: none;
        z-index: 1;
      }
      #playhead.show {
        display: block;
      }
      /* Marks the exact point the readout describes. */
      #pin {
        position: fixed;
        display: none;
        width: 13px;
        height: 13px;
        margin: -7px 0 0 -7px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 2;
      }
      #pin.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hint">Record, or open or drop an audio file</div>
    <div id="ui">
      <div id="controls">
        <button
          class="ctl"
          id="rec-btn"
          type="button"
          title="Record (R)"
          aria-label="Record"
        >
          <svg class="off-icon" viewBox="0 0 16 16">
            <circle cx="8" cy="8" r="5" fill="currentColor" />
          </svg>
          <svg class="on-icon" viewBox="0 0 16 16">
            <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" />
          </svg>
        </button>
        <button
          class="ctl"
          id="open-btn"
          type="button"
          title="Open an audio file (O)"
          aria-label="Open an audio file"
        >
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 10V2.5M4.75 5.5 8 2.25l3.25 3.25M2.5 10v3.5h11V10" />
          </svg>
        </button>
        <button
          class="ctl"
          id="play-btn"
          type="button"
          title="Play what is on screen (P or Space)"
          aria-label="Play"
          disabled
        >
          <svg class="off-icon" viewBox="0 0 16 16">
            <path d="M5 3.25v9.5L12.5 8z" fill="currentColor" />
          </svg>
          <svg class="on-icon" viewBox="0 0 16 16">
            <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" />
          </svg>
        </button>
        <button
          class="ctl"
          id="save-btn"
          type="button"
          title="Save a large image (S)"
          aria-label="Save image"
          disabled
        >
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 2.25v7.5M4.75 6.75 8 10l3.25-3.25M2.5 10v3.5h11V10" />
          </svg>
        </button>
      </div>
      <input
        id="file"
        type="file"
        accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg"
        hidden
      />
      <div id="readout">
        <span id="status"></span>
        <span id="busy" aria-hidden="true"></span>
      </div>
    </div>
    <div id="playhead"></div>
    <div id="pin"></div>
    <div id="inspect">
      <button id="close" type="button" aria-label="Close readout">×</button>
      <div id="inspect-head"></div>
      <dl id="inspect-rows"></dl>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
