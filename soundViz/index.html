<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Sound Visualizer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none; /* no scroll or pinch while holding */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none; /* no callout on a long press */
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        top: max(14px, env(safe-area-inset-top));
        display: flex;
        align-items: center;
        gap: 12px;
        font:
          13px "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        pointer-events: none; /* the whole screen is the button */
      }
      #hint {
        padding: 7px 15px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        color: #e8f0ff;
      }
      #status {
        color: rgba(232, 240, 255, 0.65);
      }
      #status.rec {
        color: #ff5a4a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui">
      <div id="hint">Hold anywhere to record</div>
      <span id="status"></span>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
