<!doctype html>
<html>
<head>
<meta charset="utf-8">

<title>SSX 3 Mountain</title>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js">
<style>
  :root { --panel: rgba(16, 22, 34, 0.82); --text: #e6ecf5; --muted: #8a97ab; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d1320; color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  a { color: #9cc3ff; }
  #panel { position: absolute; top: 12px; left: 12px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border-radius: 8px; padding: 10px 12px; width: 250px; box-sizing: border-box; }
  #panelHead { display: flex; align-items: center; gap: 8px; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; pointer-events: none;
    padding: 0 16px; text-align: center; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); display: none; }
  #where { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border-radius: 6px; padding: 4px 12px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 24px);
    box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
  #where:empty, #inspect[hidden] { display: none; }
  #inspect { position: absolute; top: 12px; right: 12px; width: 280px; background: var(--panel); border-radius: 8px;
    padding: 10px 12px; box-sizing: border-box; }

  @media (pointer: coarse) {

  /* phones: panel across the top, readouts along the bottom */
  @media (max-width: 640px) {
    #panel { top: 8px; left: 8px; right: 8px; width: auto; max-height: 60%; }
    #where { top: auto; bottom: 44px; }

</style>

<body>
<div id="loading">Loading the mountain…</div>
<div id="status"></div>
<div id="where"></div>
<div id="inspect" hidden><button id="inspectClose" title="Close">×</button><div id="inspectBody"></div>
  <button id="copyView">Copy view + details</button></div>
<div id="hint"></div>
<div id="panel">
  <div id="panelHead"><h1>SSX 3 — the mountain</h1><button id="panelToggle">Hide</button></div>
  <p id="help"></p>
  <div class="buttons">
    <button id="all">All</button><button id="none">None</button><button id="textures">Textures: on</button><button id="objects">Objects: on</button>
  </div>
  <details><summary>More</summary><div class="buttons">
    <button id="lighting" title="Baked: the game's own lightmaps and vertex lighting. Viewer: plain sun and sky lights.">Lighting: baked</button><button id="panels" title="Big flat cards (backdrops, tree lines) drawn with see-through textures: 2D trees, signs, glass">Panels: on</button><button id="helpers" title="Things the game doesn't draw as modelled: translucent editor volumes, editor arrow boxes, and placeholders like the black slabs by jumps and point-multiplier cubes">Helpers: off</button><button id="blocks" title="Big plain boxes with snow or ice textures (e.g. on Snow Jam), probably invisible blockers">Blocks: off</button><button id="sky" title="The game's sky for the part of the mountain you're looking at">Sky: on</button><button id="wire">Wireframe</button><button id="mode" title="Map: drag, zoom and rotate like Google Earth. Fly: first-person flying with the keyboard.">Camera: map</button>
  </div></details>
  <div id="list"></div>
  <p class="credit">The world of SSX 3 (EA Canada, 2003), rebuilt from the GameCube disc. A fan project, not affiliated
    with EA. <a href="https://github.com/andrewmaxwell/junk/tree/master/ssx3" target="_blank">How it works</a></p>
</div>
<script>
// Start the worker and the overview download right away, while three.js is still on its way.
window.ssx = (() => {
  const loading = document.getElementById('loading');
  if (location.protocol === 'file:') {
    loading.textContent = 'This page needs a web server: run python3 -m http.server in its folder.';
    return {};
  }
  const worker = new Worker('worker.js'), calls = new Map();
  let next = 0;
  worker.onmessage = ({ data }) => {
    const call = calls.get(data.id);
    if ('progress' in data) return call.onProgress?.(data.progress);
    calls.delete(data.id);
    if (data.error) call.reject(new Error(data.error)); else call.resolve(data.result);
  };
  const request = (kind, file, onProgress) => new Promise((resolve, reject) => {
    const id = next++;
    calls.set(id, { resolve, reject, onProgress });
    worker.postMessage({ id, kind, url: `data/${file}` });
  });
  const overview = request('overview', 'overview.bin', p => { loading.textContent = `Loading the mountain… ${Math.round(p * 100)}%`; });
  overview.catch(e => { loading.textContent = `Couldn't load the mountain (${e.message.split('\n')[0]})`; });
  return { request, overview };
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Files are fetched, unpacked and turned into plain arrays by worker.js (see window.ssx above);
// this page only makes three.js objects out of them.
function makeTexture({ w, h, rgba }, wrap, mipmaps) {
  const tex = new THREE.DataTexture(rgba, w, h, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = wrap;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = mipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  tex.generateMipmaps = mipmaps;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = mipmaps ? anisotropy : 1;
  tex.needsUpdate = true;
  return tex;
}
// flags from the export: 1 = helper (hidden with Helpers), 2 = additive glow
const textureEntry = ({ id, flags, mode, ...image }) =>
  ({ id, mode, helper: !!(flags & 1), additive: !!(flags & 2), tex: makeTexture(image, THREE.RepeatWrapping, true) });

// ---------- scene ----------
const loadingText = document.getElementById('loading');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  loadingText.textContent = "This browser can't show 3D graphics (WebGL is unavailable).";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));  // 3x phone screens cost a lot for little gain
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const anisotropy = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const sky = new THREE.Color(0x0d1320);  // behind everything until (or unless) the game's sky is drawn
renderer.setClearColor(sky);
renderer.autoClear = false;
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x5a6070, 2.0));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(1, 1.4, 0.6);
scene.add(sun);

// Baked lighting is stored at half strength and doubled on gamma-encoded colours: about 2^2.2 in
// three.js's linear space (worker.js applies the same gain to object vertex colours).
const BAKED_GAIN = 2 ** 2.2;
const touchOnly = matchMedia('(hover: none)').matches;  // phones and tablets: no keyboard, no hover
const MAX_DETAILED = touchOnly ? 5 : 8;  // locations kept in memory at full detail

const status = document.getElementById('status');
const overview = await ssx.overview;
const { center, span, scale: SCALE } = overview;  // game -> scene: (p - center) * SCALE, Z-up -> Y-up
scene.fog = new THREE.Fog(sky, span * 1.2, span * 4);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, span / 20000, span * 10);
camera.position.set(span * 0.9, span * 0.6, span * 0.9);
camera.lookAt(0, 0, 0);

// ---------- camera: map style (default) or fly ----------
// Map style is the Google Earth convention: drag slides the ground, scroll / pinch zooms toward
// the cursor, right-drag or Shift-drag rotates and tilts, double-click flies to a spot.
const canvas = renderer.domElement;
// Orbit controls only rotate (right-drag or Shift-drag); panning and zooming are done below by
// grabbing the point under the cursor, so their speed always matches the ground you're touching.
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.ROTATE };
controls.maxPolarAngle = Math.PI * 0.49;  // stay above the horizon

const keys = new Set();
const fly = { on: false, speed: span * 0.03, base: span * 0.03, look: new THREE.Euler(0, 0, 0, 'YXZ') };
const forward = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();

// What is under a screen point? Only terrain is tested, which is plenty to aim with and much cheaper.
function groundAt(x, y) {
  pointer.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const targets = [];
  for (const loc of locations) {
    if (!loc.root.visible) continue;
    if (loc.detail?.visible) targets.push(...loc.detail.userData.kinds.terrain);
    else if (loc.overview?.visible) targets.push(loc.overview);
  }
  return raycaster.intersectObjects(targets, false)[0]?.point ?? null;
}

// When the middle of the view is empty sky, pivot at the distance of the location closest to
// the line of sight instead, so zooming still covers ground at a sensible rate.
function pivotAlongView() {
  camera.getWorldDirection(forward);
  let best = span, bestAngle = Infinity;
  for (const loc of locations) {
    if (!loc.root.visible) continue;
    const along = move.copy(loc.sphere.center).sub(camera.position).dot(forward);
    if (along <= 0) continue;
    const off = move.copy(camera.position).addScaledVector(forward, along).distanceTo(loc.sphere.center) / along;
    if (off < bestAngle) { bestAngle = off; best = along; }
  }
  return camera.position.clone().addScaledVector(forward, best);
}

// Keep the pivot on the ground in the middle of the view, so pan, zoom and rotate speeds always
// match how far away the terrain really is. Re-aimed at the start of each gesture, at most every 300ms.
let lastAim = 0;
function aimPivot() {
  const now = performance.now();
  if (now - lastAim < 300) return;
  lastAim = now;
  controls.target.copy(groundAt(innerWidth / 2, innerHeight / 2) ?? pivotAlongView());
}
controls.addEventListener('start', aimPivot);
window.viewer = { camera, controls, scene, debug: () => ({ keys: [...keys], mapSpeed, groundHeight, flySpeed: fly.speed, flyBase: fly.base, mouse,
  state: name => { const l = locations.find(l => l.name === name); return l && { rootVisible: l.root.visible, detail: !!l.detail, detailVisible: l.detail?.visible ?? null, overviewVisible: l.overview?.visible ?? null, near: isNear(l), dist: camera.position.distanceTo(l.sphere.center), radius: l.sphere.radius }; },
  detailed: () => locations.filter(l => l.detail).map(l => l.name + (l.detail.visible ? '' : '(hidden)')),
  pick: (x, y, terrainOnly) => { const h = pickAt(x, y, terrainOnly); return h && { loc: h.object.userData.info.loc.name, kind: h.object.userData.info.kind, dist: h.distance }; } }) };  // handy from the browser console (see also #view= in the address)

// Double-click: glide toward the point, ending a third of the way from it.
let glide = null;
function glideTo(x, y) {
  const hit = groundAt(x, y);
  if (!hit) return;
  glide = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), target: hit,
            pos: hit.clone().add(camera.position.clone().sub(hit).multiplyScalar(0.35)) };
}
canvas.addEventListener('dblclick', e => { if (!fly.on && lastPointerType !== 'touch') glideTo(e.clientX, e.clientY); });
function glideStep(dt) {
  if (!glide) return;
  glide.t = Math.min(1, glide.t + dt / 0.7);
  const e = 1 - (1 - glide.t) ** 3;  // ease out
  camera.position.lerpVectors(glide.fromPos, glide.pos, e);
  controls.target.lerpVectors(glide.fromTarget, glide.target, e);
  if (glide.t === 1) glide = null;
}

// Keyboard works in both modes. In map mode W A S D slide across the terrain (camera and pivot
// together) at a speed proportional to the distance to the pivot, so it suits any height.
const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyC', 'Space', 'ShiftLeft', 'ShiftRight',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.target.closest?.('input')) return;
  if (MOVE_KEYS.has(e.code)) {
    keys.add(e.code);
    e.preventDefault();  // stop Space scrolling the panel or toggling a focused button
  }
  const factor = { Minus: 1 / 1.25, BracketLeft: 1 / 1.25, Equal: 1.25, BracketRight: 1.25 }[e.code];
  if (factor) {
    fly.speed *= factor;
    flash(`Speed ${(fly.speed / fly.base).toFixed(1)}×`);
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// Map-mode key speed follows the camera's height above the terrain straight below (checked a few
// times a second, eased so it never jumps). Tying it to the pivot distance made it jump whenever a
// drag or scroll re-aimed the pivot at far-off terrain or empty sky.
const down = new THREE.Vector3(0, -1, 0);
let groundHeight = null, lastHeightCheck = 0, mapSpeed = null;
function heightAboveGround() {
  const now = performance.now();
  if (now - lastHeightCheck > 200) {
    lastHeightCheck = now;
    raycaster.set(camera.position, down);
    const hit = raycaster.intersectObjects(visibleMeshes(true), false)[0];
    if (hit) groundHeight = hit.distance;
  }
  return groundHeight ?? camera.position.distanceTo(controls.target);
}

function keyMove(dt) {
  if (!keys.size) return;
  const k = keys, boost = k.has('ShiftLeft') || k.has('ShiftRight') ? 5 : 1;
  const ahead = (k.has('KeyW') || k.has('ArrowUp')) - (k.has('KeyS') || k.has('ArrowDown'));
  const side = (k.has('KeyD') || k.has('ArrowRight')) - (k.has('KeyA') || k.has('ArrowLeft'));
  const up = (k.has('Space') || k.has('KeyE')) - (k.has('KeyQ') || k.has('KeyC'));
  camera.getWorldDirection(forward);
  if (!fly.on) forward.y = 0;  // map mode: slide level with the ground
  forward.normalize();
  right.crossVectors(forward, camera.up).normalize();
  move.set(0, 0, 0).addScaledVector(forward, ahead).addScaledVector(right, side).addScaledVector(camera.up, up);
  if (!move.lengthSq()) return;
  let speed = fly.speed;
  if (!fly.on) {
    const wanted = Math.max(heightAboveGround(), span * 0.0005) * 0.8;
    mapSpeed = mapSpeed === null ? wanted : mapSpeed + (wanted - mapSpeed) * Math.min(1, dt * 2);
    speed = mapSpeed * fly.speed / fly.base;
  }
  move.normalize().multiplyScalar(speed * boost * dt);
  camera.position.add(move);
  if (!fly.on) controls.target.add(move);
}

// Fly mode: drag (or click to capture the mouse) to look; swipes glide.
const flying = () => document.pointerLockElement === canvas;
let drag = null;
canvas.addEventListener('pointerdown', e => { if (fly.on && e.button === 0 && !flying()) drag = { moved: 0 }; });
addEventListener('pointerup', () => {
  // browsers may refuse (e.g. without a real user gesture); dragging still works then
  if (drag && drag.moved < 4) canvas.requestPointerLock()?.catch?.(() => {});
  drag = null;
});
document.addEventListener('pointerlockchange', () => {
  document.getElementById('hint').style.display = flying() ? 'block' : 'none';
});
document.addEventListener('mousemove', e => {
  if (drag) drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  if (!fly.on || !(flying() || drag)) return;
  fly.look.y -= e.movementX * 0.002;
  fly.look.x = Math.max(-1.55, Math.min(1.55, fly.look.x - e.movementY * 0.002));
  camera.quaternion.setFromEuler(fly.look);
});
canvas.addEventListener('wheel', e => {
  if (!fly.on) return;  // map mode zooms toward the cursor (below)
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;  // lines / pages -> pixels
  const step = fly.speed * 0.004 * (e.ctrlKey ? 8 : 1);  // pinch deltas are small
  camera.getWorldDirection(forward);
  right.crossVectors(forward, camera.up).normalize();
  camera.position.addScaledVector(forward, -e.deltaY * unit * step);
  if (!e.ctrlKey) camera.position.addScaledVector(right, e.deltaX * unit * step);
}, { passive: false });

let flashTimer;
function flash(text) {
  status.textContent = text;
  status.dataset.flash = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { delete status.dataset.flash; }, 1200);
}

const HELP = {
  touch: 'Drag to move, pinch to zoom, twist to turn, slide two fingers up or down to tilt. Double-tap to fly to a spot, ' +
    'long-press to see what something is. Tap a name to go there.',
  map: '<b>Map:</b> drag to move the ground (it stays under the cursor), scroll or pinch to zoom toward the cursor, right-drag or Shift-drag to rotate and tilt, double-click to fly there. W A S D and Space / Q also move; Shift is faster, − / = set speed.',
  fly: '<b>Fly:</b> W A S D move, Space / Q up and down, Shift is faster, − / = set speed. Two-finger swipe or pinch to glide. Drag to look, or click the view to steer with the mouse (Esc lets go).',
};
function setMode(flyOn) {
  fly.on = flyOn;
  controls.enabled = !flyOn;
  glide = null;
  document.getElementById('mode').textContent = `Camera: ${flyOn ? 'fly' : 'map'}`;
  document.getElementById('help').innerHTML = touchOnly ? HELP.touch : HELP[flyOn ? 'fly' : 'map'] +
    ' Click a name to jump there. Option-click (or I) shows what something is; the address keeps your view.';
  if (flyOn) {
    fly.look.setFromQuaternion(camera.quaternion);
  } else {
    if (flying()) document.exitPointerLock();
    // pivot on whatever ground is in front of the camera
    controls.target.copy(groundAt(innerWidth / 2, innerHeight / 2) ?? pivotAlongView());
  }
}

// ---------- view state and materials ----------
const view = { sky: true, textures: true, lighting: 'baked', objects: true, panels: true, helpers: false, blocks: false, wire: false };
const allMaterials = new Set();  // for the wireframe toggle
const track = m => { allMaterials.add(m); m.wireframe = view.wire; return m; };
const pick = mesh => mesh.userData.mats[view.lighting][view.textures ? 'textured' : 'flat'];
const applyMaterials = () => scene.traverse(o => { if (o.isMesh) o.material = pick(o); });

// Four materials per (texture, lightmap, colour): textured or flat, baked or viewer-lit.
// Each location has its own cache, freed with it.
function materials(materialCache, t, lm, flatColor, vertexLit, solid) {
  const key = [t?.tex.uuid, lm?.uuid, flatColor.getHexString(), vertexLit, solid].join(':');
  if (!materialCache.has(key)) {
    // Terrain is always solid: road textures keep a full snow image in their colour channel and
    // use alpha as a mask for some other effect, so treating it as transparency punches holes.
    const blend = !solid && t?.mode === 'blend', cutout = !solid && t?.mode === 'cutout';
    const common = { side: THREE.DoubleSide, transparent: blend, depthWrite: !blend, alphaTest: cutout ? 0.5 : 0 };
    // glow textures (light on black) are added on top, so their black parts vanish
    if (!solid && t?.additive) Object.assign(common, { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const surface = t ? { map: t.tex } : { color: 0xff00ff };
    const flatSurface = { color: flatColor, alphaMap: cutout ? t.tex : null, opacity: blend ? 0.4 : 1 };
    const baked = lm ? { lightMap: lm, lightMapIntensity: BAKED_GAIN * Math.PI }  // unlit materials divide by pi
      : vertexLit ? { vertexColors: true } : {};
    materialCache.set(key, {
      viewer: {
        textured: track(new THREE.MeshStandardMaterial({ ...common, ...surface, roughness: 0.9 })),
        flat: track(new THREE.MeshStandardMaterial({ ...common, ...flatSurface, roughness: 0.9 })),
      },
      baked: {
        textured: track(new THREE.MeshBasicMaterial({ ...common, ...surface, ...baked })),
        flat: track(new THREE.MeshBasicMaterial({ ...common, ...flatSurface, ...baked })),
      },
    });
  }
  return materialCache.get(key);
}

// Raycasts through the worker's bounding-volume hierarchy (see buildBVH in worker.js): only the
// triangles in boxes the ray passes through get tested. Meshes sit at the scene origin, unrotated,
// so the ray needs no transforming. Reports the nearest hit, which is all the page ever uses.
function bvhRaycast(raycaster, intersects) {
  const { bounds, nodes, order } = this.userData.bvh;
  const pos = this.geometry.attributes.position.array, idx = this.geometry.index.array;
  const { origin: o, direction: d } = raycaster.ray;
  const ox = o.x, oy = o.y, oz = o.z, dx = d.x, dy = d.y, dz = d.z, ix = 1 / dx, iy = 1 / dy, iz = 1 / dz;
  let best = raycaster.far, bestTri = -1;
  const stack = [0];
  while (stack.length) {
    const n = stack.pop(), b = n * 6;
    // slab test against the node's box
    let t1 = (bounds[b] - ox) * ix, t2 = (bounds[b + 3] - ox) * ix;
    let near = Math.min(t1, t2), far = Math.max(t1, t2);
    t1 = (bounds[b + 1] - oy) * iy; t2 = (bounds[b + 4] - oy) * iy;
    near = Math.max(near, Math.min(t1, t2)); far = Math.min(far, Math.max(t1, t2));
    t1 = (bounds[b + 2] - oz) * iz; t2 = (bounds[b + 5] - oz) * iz;
    near = Math.max(near, Math.min(t1, t2)); far = Math.min(far, Math.max(t1, t2));
    if (near > far || far < raycaster.near || near > best) continue;
    const first = nodes[n * 2], count = nodes[n * 2 + 1];
    if (!count) { stack.push(first, n + 1); continue; }  // inner node: right child, then left
    for (let i = first; i < first + count; i++) {  // Moller-Trumbore, both sides
      const t = order[i], a = idx[t * 3] * 3, bb = idx[t * 3 + 1] * 3, c = idx[t * 3 + 2] * 3;
      const e1x = pos[bb] - pos[a], e1y = pos[bb + 1] - pos[a + 1], e1z = pos[bb + 2] - pos[a + 2];
      const e2x = pos[c] - pos[a], e2y = pos[c + 1] - pos[a + 1], e2z = pos[c + 2] - pos[a + 2];
      const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
      const det = e1x * px + e1y * py + e1z * pz;
      if (Math.abs(det) < 1e-12) continue;
      const inv = 1 / det, sx = ox - pos[a], sy = oy - pos[a + 1], sz = oz - pos[a + 2];
      const u = (sx * px + sy * py + sz * pz) * inv;
      if (u < 0 || u > 1) continue;
      const qx = sy * e1z - sz * e1y, qy = sz * e1x - sx * e1z, qz = sx * e1y - sy * e1x;
      const v = (dx * qx + dy * qy + dz * qz) * inv;
      if (v < 0 || u + v > 1) continue;
      const dist = (e2x * qx + e2y * qy + e2z * qz) * inv;
      if (dist >= raycaster.near && dist < best) { best = dist; bestTri = t; }
    }

  if (bestTri >= 0) intersects.push({ distance: best, point: raycaster.ray.at(best, new THREE.Vector3()), object: this, faceIndex: bestTri });

function buildDetail(loc, { lightmaps, textures, meshes, ids }) {
  loc.textures = new Map(textures.map(t => [t.id, textureEntry(t)]));
  loc.materials = new Map();
  const texture = id => loc.textures.get(id) ?? sharedTextures.get(id) ?? null;
  // Lightmap atlases (the worker packs each location's sheets together). Each sheet is small
  // per-patch regions with 1-texel gutters, and the game stores no mips for them. Mipmapping would
  // average neighbouring patches together at a distance (hard-edged blotches of the wrong
  // brightness), so sample only the full-size image.

    const tex = makeTexture(image, THREE.ClampToEdgeWrapping, false);
    tex.channel = 1;  // lightmaps use the second UV set

  const kinds = { terrain: [], objects: [], panels: [], helpers: [], blocks: [] };
  for (const m of meshes) {

    const attrs = terrain ? { uv: [m.uv, 2], uv1: [m.uv1, 2], normal: [m.normal, 3] }
      : { uv: [m.uv, 2], color: [m.col, 3], normal: [m.normal, 3] };
    const mesh = makeMesh(m.pos, m.idx, attrs, mats, m.bvh);
    if (!terrain && (t?.mode === 'blend' || t?.additive)) mesh.renderOrder = 1;
    mesh.userData.info = terrain ? { kind: 'terrain', loc, texId: m.texId, firstPatch: m.firstPatch, trisPerPatch: m.trisPerPatch }

function disposeDetail(loc) {
  loc.detail.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  for (const t of loc.lightmaps) t.dispose();

    m.dispose();

// ---------- level of detail ----------

const isNear = loc => camera.position.distanceTo(loc.sphere.center) < loc.sphere.radius * 2 + span * 0.02;

  for (const loc of locations) {
    const show = wanted.has(loc);
    if (show) loc.lastNear = now;
    if (loc.detail) loc.detail.visible = show;
    if (loc.overview) loc.overview.visible = !(show && loc.detail);
  }
  const loaded = locations.filter(l => l.detail && !wanted.has(l)).sort((a, b) => a.lastNear - b.lastNear);
  while (locations.filter(l => l.detail).length > MAX_DETAILED && loaded.length) disposeDetail(loaded.shift());
  updateSky();
  if (busy) return;
  const want = [...wanted].find(l => !l.detail);
  if (!want) {
    if (!status.dataset.flash) status.textContent = `${locations.filter(l => l.detail?.visible).length} locations in full detail`;
    return;

  busy = true;
  status.textContent = `Loading ${want.name}…`;

    want.detail = buildDetail(want, data);

// ---------- sky ----------
// Each section (A-E) has a skybox: a dome 300 game units across that the game draws around the
// camera. It gets its own scene and camera, at the dome's origin and turned like the main camera,
// drawn before the mountain. The sky shown is the one for the section of the nearest location.

function updateSky() {

    .reduce((m, l) => !m || camera.position.distanceTo(l.sphere.center) - l.sphere.radius
      < camera.position.distanceTo(m.sphere.center) - m.sphere.radius ? l : m, null);
  const letter = nearest?.name[0];
  if (!letter || letter === skyLetter) return;
  skyLetter = letter;
  for (const [key, group] of skies) if (group) group.visible = key === letter;
  if (skies.has(letter) || !locations.some(l => l.name === letter + 'SKY')) return;
  skies.set(letter, null);
  ssx.request('sky', `${letter}SKY.bin`).then(({ textures, meshes }) => {
    const group = new THREE.Group();
    const own = new Map(textures.map(t => [t.id, textureEntry(t)]));
    for (const m of meshes) {

        depthWrite: false, transparent: t?.mode === 'blend', alphaTest: t?.mode === 'cutout' ? 0.5 : 0 });

addEventListener('resize', () => {

// ---------- where am I? ----------
// Scene position back to the game's own coordinates (Z-up, unscaled).
const toGame = p => [p.x / SCALE + center[0], -(p.z / SCALE + center[2]), p.y / SCALE + center[1]];
const placeName = loc => (loc.title ? `${loc.title} · ` : '') + `${loc.name} · ${loc.what}` + (loc.peak ? ` · Peak ${loc.peak}` : '');

// Meshes that are actually on screen: full detail where loaded and visible, else the overview.
function visibleMeshes(terrainOnly) {
  const out = [];

    if (!loc.root.visible) continue;
    if (loc.detail?.visible) {
      for (const [kind, meshes] of Object.entries(loc.detail.userData.kinds))

function pickAt(x, y, terrainOnly) {

  // and a jump (e.g. from a #view= link) leaves it with the new position but the old rotation.
  camera.updateMatrixWorld();
  pointer.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);

canvas.addEventListener('pointerdown', e => { lastPointerType = e.pointerType; }, { capture: true });

// Where the cursor points when it isn't over terrain: a level plane at the height of the ground

  controls.target.sub(anchor).applyQuaternion(turnQ).add(anchor);
  camera.lookAt(controls.target);
}
// Positive angles tip the view toward the horizon; it stays between straight down and just above level.
function tilt(anchor, angle) {
  const offset = camera.position.clone().sub(controls.target), polar = offset.angleTo(upAxis);
  angle = Math.min(Math.max(polar + angle, 0.02), controls.maxPolarAngle) - polar;
  tiltAxis.crossVectors(upAxis, offset).normalize();  // rotating about this raises the polar angle
  if (tiltAxis.lengthSq()) rotateAround(anchor, tiltAxis, angle);
}

// the readout at the top: the location under the mouse, or else in the middle of the view
const where = document.getElementById('where');
let lastWhere = '';
setInterval(() => {
  // also refresh when detail streams in or out, or a group is toggled, even if nothing moved
  const shown = locations.map(l => (l.root.visible ? 1 : 0) + (l.detail?.visible ? 2 : 0)).join('');
  const key = camera.position.toArray().map(v => v.toFixed(3)).join() + `:${mouse.x},${mouse.y}:${shown}`;
  if (key === lastWhere) return;
  lastWhere = key;
  const hit = pickAt(mouse.x, mouse.y, true) ?? pickAt(innerWidth / 2, innerHeight / 2, true);
  where.textContent = hit ? `Looking at ${placeName(hit.object.userData.info.loc)}` : '';
}, 400);

// Option-click (or I) inspects whatever is under the cursor.
const marker = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff3366, depthTest: false }));
marker.renderOrder = 10;
marker.visible = false;
scene.add(marker);
canvas.addEventListener('click', e => { if (e.altKey) inspect(e.clientX, e.clientY); });
addEventListener('keydown', e => {
  if (e.code === 'KeyI' && !e.metaKey && !e.ctrlKey && !e.target.closest?.('input')) inspect(mouse.x, mouse.y);
  if (e.code === 'Escape') closeInspect();
});

function describeHit(hit) {
  const info = hit.object.userData.info, loc = info.loc, rows = [['Where', placeName(loc)]];
  const ids = loc.detail?.userData.ids;
  if (info.kind === 'terrain' && ids) {
    const patch = info.firstPatch + Math.floor(hit.faceIndex / info.trisPerPatch);
    rows.push(['What', `terrain patch #${ids.patchRid[patch]}`], ['Texture', `${info.texId}`]);
  } else if (info.kind !== 'overview' && ids) {
    const owners = info.owners;
    let lo = 0, hi = owners.length / 2 - 1;  // last (first triangle, placement) pair at or before this triangle
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (owners[mid * 2] <= hit.faceIndex) lo = mid; else hi = mid - 1; }
    const placement = owners[lo * 2 + 1], [track, rid] = ids.modelKeys[ids.instModel[placement]];
    rows.push(['What', `${info.kind === 'objects' ? 'object' : info.kind.replace(/s$/, '')} · placement #${ids.instRid[placement]}`],
              ['Model', `#${rid} (track ${track})`], ['Texture', `${info.texId}`]);
  } else {
    rows.push(['What', 'low-detail overview (fly closer for detail)']);
  }
  rows.push(['Game xyz', toGame(hit.point).map(v => Math.round(v)).join(', ')]);
  return rows;
}

function inspect(x, y) {
  const hit = pickAt(x, y, false);
  if (!hit) return;
  const rows = describeHit(hit);
  document.getElementById('inspectBody').innerHTML =
    rows.map(([k, v]) => `<div><span class="k">${k}:</span> ${v}</div>`).join('');
  lastInspect = rows.map(([k, v]) => `${k}: ${v}`).join('\n');
  document.getElementById('inspect').hidden = false;
  marker.position.copy(hit.point);
  marker.scale.setScalar(camera.position.distanceTo(hit.point) * 0.006);
  marker.visible = true;
}
function closeInspect() {
  document.getElementById('inspect').hidden = true;
  marker.visible = false;
}
document.getElementById('inspectClose').onclick = closeInspect;

// The view lives in the address (#view=camera xyz,target xyz), so a link reopens the same spot.
function viewHash() {
  return 'view=' + [...camera.position.toArray(), ...controls.target.toArray()].map(v => +v.toFixed(3)).join(',');
}
function applyHash() {
  const m = location.hash.match(/view=([-\d.,e]+)/);
  const v = m?.[1].split(',').map(Number);
  if (!v || v.length !== 6 || v.some(Number.isNaN)) return false;
  camera.position.set(v[0], v[1], v[2]);
  controls.target.set(v[3], v[4], v[5]);
  camera.lookAt(controls.target);
  camera.updateMatrixWorld();
  fly.look.setFromQuaternion(camera.quaternion);
  return true;
}
applyHash();
let lastHash = '';
setInterval(() => {
  const h = viewHash();
  if (h !== lastHash) { lastHash = h; history.replaceState(null, '', '#' + h); }
}, 500);
document.getElementById('copyView').onclick = async () => {
  const text = `${lastInspect}\nView: ${location.href.split('#')[0]}#${viewHash()}`;
  try { await navigator.clipboard.writeText(text); flash('Copied'); }
  catch { prompt('Copy this:', text); }
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  keyMove(dt);
  glideStep(dt);
  if (!fly.on) controls.update();
  renderer.clear();
  if (view.sky) {
    skyCamera.quaternion.copy(camera.quaternion);
    renderer.render(skyScene, skyCamera);
    renderer.clearDepth();
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
