<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Particle Life</title>
    <meta
      name="description"
      content="200,000 particles following a few random rules of attraction gather into worms, cells and swimmers. Stir them, zoom in, and roll new rules."
    />
    <meta property="og:title" content="Particle Life" />
    <meta
      property="og:description"
      content="200,000 particles following a few random rules of attraction gather into worms, cells and swimmers. Stir them, zoom in, and roll new rules."
    />
    <meta
      property="og:image"
      content="https://andrewmaxwell.github.io/junk/particle-life/image.png"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='5' cy='6' r='3' fill='%2350dc78'/><circle cx='11' cy='6' r='2' fill='%23f05050'/><circle cx='8' cy='11.5' r='2.5' fill='%2390a0ff'/></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: black;
        color: white;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }
      body > canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .note {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
        text-align: center;
        pointer-events: none;
        transition: opacity 1s;
      }
      #hint {
        bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .touch,
      .mouse {
        display: none;
      }
      @media (pointer: fine) {
        .mouse {
          display: inline;
        }
      }
      @media not (pointer: fine) {
        .touch {
          display: inline;
        }
      }
      #status {
        bottom: calc(72px + env(safe-area-inset-bottom));
        opacity: 0;
      }
      .lil-gui.root {
        margin-top: env(safe-area-inset-top);
        margin-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="status" class="note"></div>
    <div id="hint" class="note">
      <span class="mouse"
        >drag to stir · scroll to zoom · <b>new rules</b> for another
        world</span
      ><span class="touch"
        >drag to stir · pinch to zoom<br /><b>Controls</b> has new rules</span
      >
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
