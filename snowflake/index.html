<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snowflake</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #ccc;
        font:
          13px system-ui,
          sans-serif;
      }
      #view {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #view:active {
        cursor: grabbing;
      }
      #chart {
        position: fixed;
        left: 8px;
        bottom: 32px;
        width: min(340px, calc(100vw - 16px));
        height: 210px;
        border-radius: 8px;
        touch-action: none;
        cursor: crosshair;
      }
      #stats {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="chart"></canvas>
    <div id="stats"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
