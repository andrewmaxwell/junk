<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Snowflake</title>
    <meta
      name="description"
      content="Draw the weather a snow crystal falls through and watch it grow in 3D."
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #ccc;
        font:
          13px system-ui,
          sans-serif;
      }
      #view {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #view:active {
        cursor: grabbing;
      }
      #chart {
        position: fixed;
        left: 8px;
        bottom: calc(32px + env(safe-area-inset-bottom));
        width: min(360px, calc(100vw - 16px));
        height: 230px;
        border-radius: 10px;
        box-shadow:
          0 0 0 1px #ffffff1a,
          0 6px 24px #0008;
        touch-action: none;
        cursor: crosshair;
      }
      #stats {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #stats.error {
        top: 40%;
        bottom: auto;
        text-align: center;
        font-size: 16px;
        color: #fff;
      }
      /* Once a crystal is grown, point at what to do next */
      .nudge button {
        animation: nudge 1.6s ease-in-out infinite alternate;
      }
      @keyframes nudge {
        to {
          background: #3a6a8a;
        }
      }
      @media (max-width: 600px) {
        #chart {
          height: 170px;
          bottom: calc(48px + env(safe-area-inset-bottom));
        }
        #stats {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="chart"></canvas>
    <div id="stats"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
