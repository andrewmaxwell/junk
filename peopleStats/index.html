<!DOCTYPE html>
<html>
  <head>
    <title>People Stats</title>
    <style>
      a {color: #CCF}
      a:hover {color: #AAF}
      table {border-collapse: collapse; font-size: 12px}
      th {font-weight: normal}
      thead th {height: 140px; white-space: nowrap}
      thead div {transform: translate(0, 55px) rotate(300deg); width: 14px}
      tbody th {text-align: right; padding-right: 5px}
      h3 {margin-bottom: 0}
      .paren {opacity: 0.5;}
      button {padding: 0 4px; border: 0; background: #444; color: #AAA; cursor: pointer; margin: 0 0 0 5px}
      button:hover {background: #888}
      .cols {display: flex; flex-wrap: wrap; gap: 0 48px}
      .hists {display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px 24px}
      .hists h4 {margin: 0 0 4px; font-weight: normal; font-size: 13px}
      .bars {display: flex; align-items: flex-end; height: 50px; gap: 2px}
      .bars div {flex: 1; background: #468; min-height: 1px}
      .bars div:hover {background: #8AC}
      .bars div.mine {background: #FC4}
      .axis {display: flex; font-size: 10px; opacity: 0.5}
      .axis span {flex: 1; text-align: center}
      .me-traits {display: grid; grid-template-columns: max-content minmax(80px, 300px) max-content; gap: 3px 8px; align-items: center; font-size: 13px}
      .track {position: relative; height: 10px; background: #333}
      .track .bar {position: absolute; left: 0; top: 0; bottom: 0; background: #FC4}
      .track .avg {position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #FFF}
    </style>
  </head>
  <body style="font-family: sans-serif; background:#111;color:#EEE">
    <p>If you haven't already, take the survey <a href="https://forms.gle/jV1qtBsuJdsmL1AF9" target="_blank">here</a>.</p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js" integrity="sha512-SGWgwwRA8xZgEoKiex3UubkSkV1zSE1BS6O4pXcaxcNtUlQsOmOmhVnDwIvqGRfEmuz83tIGL13cXMZn6upPyg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
