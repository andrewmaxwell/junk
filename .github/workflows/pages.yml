name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Large folders kept out of the site: never checked out or published.
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/skull/
            !/dalle-elves/
            !/dalle-elements/

      # Each Vite app's dist/ is cached under a hash of its source, so a push
      # that doesn't touch an app restores its last build instead of rebuilding.
      - name: Restore languageModel build
        id: lm
        uses: actions/cache@v4
        with:
          path: languageModel/dist
          key: languageModel-dist-${{ hashFiles('languageModel/**') }}

      - name: Restore straw-art-visualizer build
        id: sav
        uses: actions/cache@v4
        with:
          path: straw-art-visualizer/dist
          key: straw-art-visualizer-dist-${{ hashFiles('straw-art-visualizer/**') }}

      - uses: actions/setup-node@v6
        if: steps.lm.outputs.cache-hit != 'true' || steps.sav.outputs.cache-hit != 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            languageModel/package-lock.json
            straw-art-visualizer/package-lock.json

      - name: Build languageModel
        if: steps.lm.outputs.cache-hit != 'true'
        working-directory: languageModel
        run: npm ci && npm run build

      - name: Build straw-art-visualizer
        if: steps.sav.outputs.cache-hit != 'true'
        working-directory: straw-art-visualizer
        run: npm ci && npm run build

      - name: Assemble site (repo + built app)
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy EVERYTHING from the repo into _site (so it stays browsable),
          # but exclude stuff you definitely don't want to publish / that is huge.
          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "_site/" \
            --exclude "**/node_modules/" \
            . _site/

          # Overlay the Vite build into /languageModel/
          mkdir -p _site/languageModel
          rm -rf _site/languageModel/assets
          cp -a languageModel/dist/. _site/languageModel/

          # Overlay the Vite build into /straw-art-visualizer/
          mkdir -p _site/straw-art-visualizer
          rm -rf _site/straw-art-visualizer/assets
          cp -a straw-art-visualizer/dist/. _site/straw-art-visualizer/

          # Optional: disable Jekyll processing (safer for files/folders starting with _)
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
