<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reaction Diffusion</title>
<meta name="description" content="Two simulated chemicals feed on and spread through each other, forming spots that divide, coral, mazes and worms. Drag to paint; explore the whole feed/kill map.">
<meta property="og:title" content="Reaction Diffusion">
<meta property="og:description" content="Two simulated chemicals feed on and spread through each other, forming spots that divide, coral, mazes and worms. Drag to paint; explore the whole feed/kill map.">
<meta property="og:image" content="https://andrewmaxwell.github.io/junk/reactionDiffusion/image.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#071a2c;color:#eef3f6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  canvas#sim{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #card{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
    width:220px;padding:10px 12px 8px;border-radius:12px;background:rgba(8,14,22,.62);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px;line-height:1.35;
    user-select:none;-webkit-user-select:none;}
  #name{font-size:15px;font-weight:600;}
  #desc{opacity:.8;margin:2px 0 8px;min-height:2.7em;}
  #map{display:block;width:100%;aspect-ratio:4/3;border-radius:6px;cursor:crosshair;touch-action:none;}
  #fk{display:flex;flex-wrap:wrap;gap:0 8px;justify-content:space-between;opacity:.75;margin-top:5px;font-variant-numeric:tabular-nums;}
  #hint{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
    padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.5);font-size:14px;white-space:nowrap;
    pointer-events:none;transition:opacity 1s;}
  #hint.gone{opacity:0;}
  #error{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;line-height:1.5;}
  #error[hidden]{display:none;}
  .lil-gui.root{margin-top:env(safe-area-inset-top);margin-right:env(safe-area-inset-right);}
  @media (max-width:600px){
    #card{width:170px;padding:8px 10px 6px;}
    #desc{display:none;}
    #name{margin-bottom:6px;font-size:14px;}
    #fk{font-size:11px;}
    #hint{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:auto;right:12px;transform:none;
      white-space:normal;max-width:140px;font-size:13px;border-radius:12px;}
  }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="card">
  <div id="name"></div>
  <div id="desc"></div>
  <canvas id="map" title="Feed rate F (up) against kill rate k (right). Drag to change them."></canvas>
  <div id="fk"><span id="fVal"></span><span id="kVal"></span></div>
</div>
<div id="hint"></div>
<div id="error" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
