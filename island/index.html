<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Island</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231d6a8a'/%3E%3Cpath d='M6 21 13 9l4 6 3-3 6 9z' fill='%2357843a'/%3E%3C/svg%3E"
    />
    <meta property="og:title" content="Island" />
    <meta
      property="og:description"
      content="Millions of years in seconds: an island rises, rivers carve its valleys, and you can raise mountains and follow a raindrop to the sea."
    />
    <meta
      property="og:image"
      content="https://andrewmaxwell.github.io/junk/island/image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #a9c3d9;
        font:
          13px system-ui,
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: calc(10px + env(safe-area-inset-left));
        color: #fff;
        background: rgba(10, 25, 35, 0.55);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border-radius: 8px;
        padding: 6px 10px;
        line-height: 1.5;
        pointer-events: none;
        max-width: calc(100% - 40px);
      }
      #status {
        top: calc(10px + env(safe-area-inset-top));
        max-width: calc(100% - 230px);
        font-variant-numeric: tabular-nums;
      }
      #info {
        bottom: calc(10px + env(safe-area-inset-bottom));
        border-left: 3px solid #ffd23f;
      }
      #hint {
        bottom: calc(10px + env(safe-area-inset-bottom));
        transition: opacity 1s;
      }
      #hint.gone {
        opacity: 0;
      }
      #error {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(400px, 80%);
        height: fit-content;
        padding: 16px;
        background: #fff;
        border-radius: 8px;
        color: #900;
      }
      .lil-gui.root {
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
      }
      @media (pointer: coarse) {
        .lil-gui {
          --widget-height: 30px;
          --font-size: 14px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="status" class="panel">Raising an island…</div>
    <div id="hint" class="panel">
      Tap the land to follow a raindrop to the sea. Pick Raise to build
      mountains.
    </div>
    <div id="info" class="panel" hidden></div>
    <div id="error" hidden></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
