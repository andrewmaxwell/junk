<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Comfort Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
<meta name="description" content="How often each part of the Lower 48 was nice enough for a walk or a sit, month by month, at 3 km.">
<meta property="og:title" content="Comfort Map">
<meta property="og:description" content="How often each part of the Lower 48 was nice enough for a walk or a sit, month by month, at 3 km.">
<meta property="og:image" content="https://andrewmaxwell.github.io/junk/comfort/map/image.png">
<meta property="og:url" content="https://andrewmaxwell.github.io/junk/comfort/map/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: oklch(0.19 0.02 250);
    --bg-2: oklch(0.14 0.015 250);
    --card: oklch(0.185 0.018 250);
    --raised: oklch(0.24 0.02 250);
    --text: oklch(0.95 0.005 250);
    --muted: oklch(0.62 0.012 250);
    --border: oklch(1 0 0 / 0.08);
    --accent: oklch(0.85 0.17 125);
  }
  * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, var(--bg-1) 0%, var(--bg-2) 60%) fixed var(--bg-2);
    color: var(--text);
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 1100px; margin: 0 auto; }
  #layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 20px; align-items: start; }
  @media (min-width: 1100px) {
    main { max-width: 1480px; }
    #layout { grid-template-columns: minmax(0, 1fr) 340px; }
    #profile { margin-top: 0 !important; position: sticky; top: 16px; }
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

  #top { display: flex; gap: 12px 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
  #heading { flex: 1 1 420px; min-width: 0; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  #subtitle { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.4; min-height: 2.8em; }
  #tools { display: flex; flex-direction: column; gap: 8px; flex: 1 1 260px; max-width: 360px; }
  #search { position: relative; }
  #search input {
    width: 100%; height: 40px; padding: 0 12px; font-size: 16px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  #search input:focus { border-color: oklch(1 0 0 / 0.25); }
  #results {
    position: absolute; z-index: 5; top: 44px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
  }
  #results:empty { display: none; }
  #results li { padding: 9px 10px; border-radius: 7px; font-size: 14px; cursor: pointer; }
  #results li small { color: var(--muted); margin-left: 6px; }
  #results li.note { color: var(--muted); cursor: default; }
  #results li[aria-selected="true"], #results li:not(.note):hover { background: var(--raised); }
  #controls .lil-gui.root { width: 100%; --width: 100%; --background-color: var(--card); --widget-color: var(--raised); --font-size: 12px; border-radius: 10px; overflow: hidden; }

  #mapWrap { position: relative; border-radius: 12px; overflow: hidden; }
  canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
  #zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button {
    width: 40px; height: 40px; border-radius: 10px; font-size: 20px; line-height: 1;
    background: oklch(0.2 0.018 250 / 0.85); border: 1px solid var(--border); backdrop-filter: blur(6px);
  }
  #zoom button[hidden] { display: none; }
  /* Fingers pinch; the buttons would only cover the map. */
  @media (pointer: coarse) { #zoomIn, #zoomOut { display: none; } }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
  #status:empty { display: none; }
  #hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.45); font-size: 15px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
  #hint.show { opacity: 1; }

  #timeline { display: flex; gap: 6px; margin-top: 12px; align-items: stretch; }
  #timeline button.seg, #play {
    height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 600;
  }
  #play { width: 44px; flex: none; font-size: 15px; }
  #year { padding: 0 12px; flex: none; }
  #months { flex: 1; display: grid; grid-template-columns: repeat(12, 1fr); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  #months span { display: grid; place-items: center; height: 38px; font-size: 12px; color: var(--muted); background: var(--card); border-left: 1px solid var(--border); }
  #months span:first-child { border-left: 0; }
  #timeline .on, #months span.on { background: var(--text); color: var(--bg-2); }

  #legend { margin-top: 12px; font-size: 12px; color: var(--muted); }
  #legend .ramp { height: 10px; border-radius: 3px; max-width: 420px; }
  #legend .ticks { display: flex; justify-content: space-between; max-width: 420px; margin-top: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .swatch { display: inline-flex; align-items: center; gap: 6px; }
  .swatch i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  #readout {
    position: absolute; pointer-events: none; display: none;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; min-width: 190px;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
  }
  #readout .place { font-weight: 600; font-size: 13px; }
  .coords { color: var(--muted); font-size: 12px; }
  #readout table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  #readout td { padding: 1px 0; }
  #readout td + td { text-align: right; padding-left: 10px; font-variant-numeric: tabular-nums; }
  #readout .active td { color: var(--text); font-weight: 600; }
  #readout .dim td { color: var(--muted); }
  #readout .hint { color: var(--muted); margin-top: 4px; }

  #profile { margin-top: 18px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 16px; scroll-margin: 16px; }
  #profile .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #profile .examples button { height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--raised); font-size: 13px; }
  #profile header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #profile h2 { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  #profile .close { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: transparent; font-size: 18px; flex: none; }
  #profile .summary { display: flex; gap: 8px 24px; flex-wrap: wrap; margin: 12px 0 6px; }
  #profile .stat b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  #profile .stat span { color: var(--muted); font-size: 13px; margin-left: 6px; }
  #profile .stat.dim b { color: var(--muted); font-size: 20px; }
  #profile svg { display: block; width: 100%; height: auto; margin-top: 4px; touch-action: manipulation; }
  #profile svg .col { cursor: pointer; }
  #profile svg text { fill: var(--muted); font-size: 11px; }
  #profile svg text.on { fill: var(--text); font-weight: 700; }
  #profile .caption { font-size: 13px; line-height: 1.5; margin-top: 8px; min-height: 3em; }
  #profile .caption .muted { color: var(--muted); }
  #profile .swatches { font-size: 12px; color: var(--muted); margin-top: 10px; }

  footer { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div id="top">
    <div id="heading">
      <h1>Comfort Map</h1>
      <p id="subtitle">Loading a year of weather…</p>
    </div>
    <div id="tools">
      <div id="search">
        <input type="search" placeholder="Search a town…" aria-label="Search a place" autocomplete="off" enterkeyhint="search">
        <ul id="results" role="listbox"></ul>
      </div>
      <div id="controls"></div>
    </div>
  </div>
  <div id="layout">
  <div>
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="status"></div>
    <div id="zoom">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomReset" aria-label="Show the whole map" hidden>⤢</button>
    </div>
    <div id="hint"></div>
    <div id="readout"></div>
  </div>
  <div id="timeline">
    <button id="play" aria-label="Play through the year">▶</button>
    <button id="year" class="seg">Year</button>
    <div id="months" role="tablist" aria-label="Month"></div>
  </div>
  <div id="legend"></div>
  </div>
  <section id="profile"></section>
  </div>
  <footer id="footer">
    Scored hour by hour with the same model as <a href="../">Walk Comfort</a>.
    Weather from NOAA's HRRR model (3 km); UV and air quality from Copernicus CAMS.
  </footer>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
