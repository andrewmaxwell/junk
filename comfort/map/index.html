<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Comfort Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: oklch(0.19 0.02 250);
    --bg-2: oklch(0.14 0.015 250);
    --card: oklch(0.185 0.018 250);
    --text: oklch(0.95 0.005 250);
    --muted: oklch(0.62 0.012 250);
    --border: oklch(1 0 0 / 0.08);
  }
  * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, var(--bg-1) 0%, var(--bg-2) 60%);
    color: var(--text);
    padding: 24px 16px 40px;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  #subtitle { color: var(--muted); font-size: 14px; margin: 0 0 16px; line-height: 1.4; }
  #mapWrap { position: relative; }
  canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  #legend { margin-top: 12px; font-size: 12px; color: var(--muted); }
  #legend .ramp { height: 10px; border-radius: 3px; max-width: 420px; }
  #legend .ticks { display: flex; justify-content: space-between; max-width: 420px; margin-top: 4px; }
  #legend .swatches { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  #legend .swatch { display: inline-flex; align-items: center; gap: 6px; }
  #legend .swatch i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #legend .note { margin-top: 6px; }
  #readout {
    position: absolute;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    min-width: 190px;
    box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
    display: none;
  }
  #readout .place { font-weight: 600; font-size: 13px; }
  #readout .coords { color: var(--muted); margin-bottom: 4px; }
  #readout table { border-collapse: collapse; width: 100%; }
  #readout td { padding: 1px 0; }
  #readout td + td { text-align: right; padding-left: 10px; font-variant-numeric: tabular-nums; }
  #readout .active td { color: var(--text); font-weight: 600; }
  #readout .dim td { color: var(--muted); }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Comfort Map</h1>
  <p id="subtitle">Loading…</p>
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="readout"></div>
  </div>
  <div id="legend"></div>
  <footer>
    Scored hour by hour with the same model as <a href="../">Walk Comfort</a>.
    Weather from the Open-Meteo Historical Forecast and Air Quality APIs.
  </footer>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
