<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Primordial</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020204;
        overflow: hidden;
        font:
          13px system-ui,
          sans-serif;
        color: #ccd;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #unsupported {
        max-width: 32em;
        margin: 20vh auto 0;
        padding: 0 16px;
        line-height: 1.5;
      }
      #unsupported h1 {
        font-size: 20px;
        font-weight: 600;
      }
      #unsupported code {
        color: #fff;
        word-break: break-all;
      }
      #hint {
        position: absolute;
        right: 12px;
        bottom: 12px;
        color: #889;
        font-size: 12px;
        pointer-events: none;
      }
      #gallery {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 300px;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
        background: rgba(10, 12, 20, 0.7);
        backdrop-filter: blur(8px);
      }
      #gallery .status {
        margin-bottom: 8px;
      }
      #gallery .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      #gallery .card {
        position: relative;
        cursor: pointer;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
      }
      #gallery .card:hover {
        outline: 2px solid #4a8;
      }
      #gallery img {
        display: block;
        width: 100%;
      }
      #gallery .star {
        position: absolute;
        top: 2px;
        right: 2px;
        background: none;
        border: 0;
        color: #fc6;
        font-size: 18px;
        cursor: pointer;
      }
      #gallery .caption {
        font-size: 10px;
        padding: 2px 4px 4px;
        color: #aab;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="hint">
      Drag to orbit, shift-drag to stir, scroll to zoom (all the way in to fly
      inside). Space pauses, R reseeds, N tries a new rule.
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
