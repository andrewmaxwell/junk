<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Columns</title>
<script>
  // This project moved to worldColumns. Old links without a map meant the
  // open-windows map, which is no longer the default.
  const query = new URLSearchParams(location.search);
  if (!query.has('map')) query.set('map', 'windows');
  location.replace(`../worldColumns/?${query}${location.hash}`);
</script>
</head>
<body>
<p>Moved to <a href="../worldColumns/?map=windows">World Columns</a>.</p>
</body>
</html>
