<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Another Raytracer</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ccc;
        font: 13px system-ui, sans-serif;
      }
      canvas {
        width: min(100vw, calc(100vh * 4 / 3));
        image-rendering: pixelated;
      }
      #stats {
        position: fixed;
        top: 8px;
        left: 8px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="stats"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
