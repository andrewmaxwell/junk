<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Another Raytracer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.25' stop-color='%23f4b860'/%3E%3Cstop offset='1' stop-color='%23402010'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <meta property="og:title" content="Another Raytracer" />
    <meta
      property="og:description"
      content="A path tracer in your browser: light beams through fog, rainbow caustics, colored shadows. Click anything to turn it into glass, metal or light."
    />
    <meta
      property="og:image"
      content="https://andrewmaxwell.github.io/junk/anotherRaytracer/image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #ccc;
        font:
          13px system-ui,
          sans-serif;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #stats {
        position: fixed;
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        right: calc(8px + env(safe-area-inset-right));
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre-line;
      }
      #caption {
        position: fixed;
        bottom: calc(48px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        max-width: calc(100vw - 16px - env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
        border-radius: 12px;
        /* No backdrop blur: it makes the browser wait for the GPU every
           frame, 160 ms frames in slow scenes */
        background: #000a;
        color: #ddd;
        font-size: 14px;
        line-height: 1.35;
        transition: opacity 0.8s;
      }
      #caption.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #caption b {
        color: #fff;
        margin-right: 6px;
      }
      #caption div {
        padding: 4px 6px;
      }
      #caption button {
        flex: none;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: #fff;
        font:
          24px system-ui,
          sans-serif;
        cursor: pointer;
      }
      @media (hover: hover) {
        #caption button:hover {
          background: #fff2;
        }
      }
      @media (max-width: 600px) {
        #stats {
          font-size: 11px;
        }
        #caption {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="stats"></div>
    <div id="caption" class="hidden">
      <button class="prev" aria-label="Previous scene">‹</button>
      <div><b></b><span></span></div>
      <button class="next" aria-label="Next scene">›</button>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
