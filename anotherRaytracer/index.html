<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Another Raytracer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #ccc;
        font: 13px system-ui, sans-serif;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #stats {
        position: fixed;
        top: 8px;
        left: 8px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="stats"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
