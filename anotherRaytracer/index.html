<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Another Raytracer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.25' stop-color='%23f4b860'/%3E%3Cstop offset='1' stop-color='%23402010'/%3E%3C/radialGradient%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <meta property="og:title" content="Another Raytracer" />
    <meta
      property="og:description"
      content="A path tracer in your browser: light beams through fog, rainbow caustics, colored shadows. Click anything to turn it into glass, metal or light."
    />
    <meta
      property="og:image"
      content="https://andrewmaxwell.github.io/junk/anotherRaytracer/image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #ccc;
        font: 13px system-ui, sans-serif;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #stats {
        position: fixed;
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: calc(8px + env(safe-area-inset-left));
        right: calc(8px + env(safe-area-inset-right));
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre-line;
      }
      @media (max-width: 600px) {
        #stats {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="stats"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
