<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSX 3 Mountain</title>
<style>
  :root { --panel: rgba(16, 22, 34, 0.82); --text: #e6ecf5; --muted: #8a97ab; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1320; color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  canvas { display: block; }
  #panel { position: absolute; top: 12px; left: 12px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border-radius: 8px; padding: 10px 12px; width: 230px; }
  #panel h1 { font-size: 14px; margin: 0 0 4px; }
  #panel p { margin: 0 0 8px; color: var(--muted); }
  .peak { margin-top: 8px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  label span.what { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  button { background: #26324a; color: var(--text); border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; pointer-events: none; }
  #hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); display: none; }
  #where { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border-radius: 6px; padding: 4px 12px; pointer-events: none; white-space: nowrap; }
  #where:empty, #inspect[hidden] { display: none; }
  #inspect { position: absolute; top: 12px; right: 12px; width: 280px; background: var(--panel); border-radius: 8px;
    padding: 10px 12px; }
  #inspect .k { color: var(--muted); }
  #inspectClose { float: right; padding: 0 6px; }
  #copyView { margin-top: 8px; }
  #status { position: absolute; right: 12px; bottom: 12px; background: var(--panel); border-radius: 6px;
    padding: 4px 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="loading">Loading the mountain…</div>
<div id="status"></div>
<div id="where"></div>
<div id="inspect" hidden><button id="inspectClose" title="Close">×</button><div id="inspectBody"></div>
  <button id="copyView">Copy view + details</button></div>
<div id="hint"></div>
<div id="panel">
  <h1>SSX 3 — the mountain</h1>
  <p id="help"></p>
  <div style="display:flex; gap:6px; flex-wrap:wrap">
    <button id="all">All</button><button id="none">None</button>
    <button id="lighting" title="Baked: the game's own lightmaps and vertex lighting. Viewer: plain sun and sky lights.">Lighting: baked</button><button id="textures">Textures: on</button><button id="objects">Objects: on</button><button id="panels" title="Big flat cards (backdrops, tree lines) drawn with see-through textures: 2D trees, signs, glass">Panels: on</button><button id="helpers" title="Things the game doesn't draw as modelled: translucent editor volumes, editor arrow boxes, and placeholders like the black slabs by jumps and point-multiplier cubes">Helpers: off</button><button id="blocks" title="Big plain boxes with snow or ice textures (e.g. on Snow Jam), probably invisible blockers">Blocks: off</button><button id="wire">Wireframe</button><button id="mode" title="Map: drag, zoom and rotate like Google Earth. Fly: first-person flying with the keyboard.">Camera: map</button>
  </div>
  <div id="list"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- data loading ----------
// Data files are <script>s calling ssxData(key, base64 gzip), because browsers
// refuse fetch() on file:// pages but happily load local scripts.
const waiting = new Map();
window.ssxData = (key, b64) => waiting.get(key)?.(b64);

function load(key, file) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    waiting.set(key, b64 => { waiting.delete(key); script.remove(); unpack(b64).then(resolve, reject); });
    script.onerror = () => reject(new Error(`could not load ${file}`));
    script.src = `data/${file}`;
    document.head.appendChild(script);
  });
}

async function unpack(b64) {
  const packed = await (await fetch(`data:application/octet-stream;base64,${b64}`)).blob();
  const buf = await new Response(packed.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const headerLen = new DataView(buf).getUint32(0, true);
  const { meta, sections } = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)));
  const base = 4 + headerLen;
  const section = (name, Type = Uint8Array) => {
    const [off, len] = sections[name];
    return new Type(buf, base + off, len / Type.BYTES_PER_ELEMENT);
  };
  return { meta, section };
}

// ---------- GameCube texture decoding ----------
function rgb565(c) {
  const r = c >> 11, g = (c >> 5) & 63, b = c & 31;
  return [r << 3 | r >> 2, g << 2 | g >> 4, b << 3 | b >> 2, 255];
}
function rgb5a3(c) {
  if (c & 0x8000) {
    const r = (c >> 10) & 31, g = (c >> 5) & 31, b = c & 31;
    return [r << 3 | r >> 2, g << 3 | g >> 2, b << 3 | b >> 2, 255];
  }
  return [((c >> 8) & 15) * 17, ((c >> 4) & 15) * 17, (c & 15) * 17, Math.round(((c >> 12) & 7) * 255 / 7)];
}
const u16 = (a, o) => a[o] << 8 | a[o + 1];

function decodeTexture(bytes, [kind, w, h, pixOff, pixLen, palOff = 0, palCount = 0], wrap) {
  const out = new Uint8Array(w * h * 4);
  let p = pixOff;
  if (kind === 0x1E) {  // CMPR: 8x8 tiles of four 4x4 DXT1 blocks
    for (let ty = 0; ty < h; ty += 8) for (let tx = 0; tx < w; tx += 8) for (let sub = 0; sub < 4; sub++) {
      const c0 = u16(bytes, p), c1 = u16(bytes, p + 2);
      const bits = (bytes[p + 4] << 24 | bytes[p + 5] << 16 | bytes[p + 6] << 8 | bytes[p + 7]) >>> 0;
      p += 8;
      const a = rgb565(c0), b = rgb565(c1);
      const pal = c0 > c1
        ? [a, b, a.map((x, i) => (2 * x + b[i]) / 3 | 0), a.map((x, i) => (x + 2 * b[i]) / 3 | 0)]
        : [a, b, a.map((x, i) => (x + b[i]) / 2 | 0), [0, 0, 0, 0]];
      const bx = tx + (sub & 1) * 4, by = ty + (sub >> 1) * 4;
      for (let i = 0; i < 16; i++) {
        const x = bx + (i & 3), y = by + (i >> 2);
        if (x < w && y < h) out.set(pal[(bits >>> (30 - 2 * i)) & 3], (y * w + x) * 4);
      }
    }
  } else {  // C8: 8x4 tiles of palette indices, RGB5A3 palette
    const pal = [];
    for (let i = 0; i < 256; i++) pal.push(i < palCount ? rgb5a3(u16(bytes, palOff + 2 * i)) : [255, 0, 255, 255]);
    for (let ty = 0; ty < h; ty += 4) for (let tx = 0; tx < w; tx += 8) for (let i = 0; i < 32; i++) {
      const x = tx + (i & 7), y = ty + (i >> 3);
      if (x < w && y < h) out.set(pal[bytes[p]], (y * w + x) * 4);
      p++;
    }
  }
  // how is alpha used? opaque, cut-out, or genuinely translucent
  let holes = 0, soft = 0;
  for (let i = 3; i < out.length; i += 4) {
    if (out[i] < 250) holes++;
    if (out[i] > 20 && out[i] < 235) soft++;
  }
  const mode = holes === 0 ? 'opaque' : soft > w * h * 0.25 ? 'blend' : 'cutout';
  const tex = new THREE.DataTexture(out, w, h, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = wrap;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = anisotropy;
  tex.needsUpdate = true;
  return { tex, mode };
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const anisotropy = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const sky = new THREE.Color(0x0d1320);
scene.background = sky;
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x5a6070, 2.0));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(1, 1.4, 0.6);
scene.add(sun);

// Baked lighting is stored at half strength (128 = full brightness) and doubled when drawn.
// The doubling happens on gamma-encoded colours, which is about 2^2.2 in three.js's linear space.
const BAKED_GAIN = 2 ** 2.2;
const LINEAR = Array.from({ length: 256 }, (_, i) => (i /= 255) <= 0.04045 ? i / 12.92 : ((i + 0.055) / 1.055) ** 2.4);

const SCALE = 1 / 1000;  // game units are tiny; keep numbers friendly for the GPU
const DETAIL_STEPS = 6;  // terrain tessellation near the camera
const MAX_DETAILED = 8;  // locations kept in memory at full detail

const status = document.getElementById('status');
const overview = await load('overview', 'overview.js');
const ov = overview.meta;
const center = ov.min.map((lo, a) => (lo + ov.max[a]) / 2);
const span = Math.max(...ov.max.map((hi, a) => hi - ov.min[a])) * SCALE;
scene.fog = new THREE.Fog(sky, span * 1.2, span * 4);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, span / 20000, span * 10);
camera.position.set(span * 0.9, span * 0.6, span * 0.9);
camera.lookAt(0, 0, 0);

// ---------- camera: map style (default) or fly ----------
// Map style is the Google Earth convention: drag slides the ground, scroll / pinch zooms toward
// the cursor, right-drag or Shift-drag rotates and tilts, double-click flies to a spot.
const canvas = renderer.domElement;
// Orbit controls only rotate (right-drag or Shift-drag); panning and zooming are done below by
// grabbing the point under the cursor, so their speed always matches the ground you're touching.
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.ROTATE };
controls.maxPolarAngle = Math.PI * 0.49;  // stay above the horizon

const keys = new Set();
const fly = { on: false, speed: span * 0.03, base: span * 0.03, look: new THREE.Euler(0, 0, 0, 'YXZ') };
const forward = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();

// What is under a screen point? Only terrain is tested, which is plenty to aim with and much cheaper.
function groundAt(x, y) {
  pointer.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const targets = [];
  for (const loc of locations) {
    if (!loc.root.visible) continue;
    if (loc.detail?.visible) targets.push(...loc.detail.userData.kinds.terrain);
    else if (loc.overview?.visible) targets.push(loc.overview);
  }
  return raycaster.intersectObjects(targets, false)[0]?.point ?? null;
}

// When the middle of the view is empty sky, pivot at the distance of the location closest to
// the line of sight instead, so zooming still covers ground at a sensible rate.
function pivotAlongView() {
  camera.getWorldDirection(forward);
  let best = span, bestAngle = Infinity;
  for (const loc of locations) {
    if (!loc.root.visible) continue;
    const along = move.copy(loc.sphere.center).sub(camera.position).dot(forward);
    if (along <= 0) continue;
    const off = move.copy(camera.position).addScaledVector(forward, along).distanceTo(loc.sphere.center) / along;
    if (off < bestAngle) { bestAngle = off; best = along; }
  }
  return camera.position.clone().addScaledVector(forward, best);
}

// Keep the pivot on the ground in the middle of the view, so pan, zoom and rotate speeds always
// match how far away the terrain really is. Re-aimed at the start of each gesture, at most every 300ms.
let lastAim = 0;
function aimPivot() {
  const now = performance.now();
  if (now - lastAim < 300) return;
  lastAim = now;
  controls.target.copy(groundAt(innerWidth / 2, innerHeight / 2) ?? pivotAlongView());
}
controls.addEventListener('start', aimPivot);
window.viewer = { camera, controls, scene, debug: () => ({ keys: [...keys], mapSpeed, groundHeight, flySpeed: fly.speed, flyBase: fly.base, mouse,
  state: name => { const l = locations.find(l => l.name === name); return l && { rootVisible: l.root.visible, detail: !!l.detail, detailVisible: l.detail?.visible ?? null, overviewVisible: l.overview?.visible ?? null, near: isNear(l), dist: camera.position.distanceTo(l.sphere.center), radius: l.sphere.radius }; },
  detailed: () => locations.filter(l => l.detail).map(l => l.name + (l.detail.visible ? '' : '(hidden)')),
  pick: (x, y, terrainOnly) => { const h = pickAt(x, y, terrainOnly); return h && { loc: h.object.userData.info.loc.name, kind: h.object.userData.info.kind, dist: h.distance }; } }) };  // handy from the browser console (see also #view= in the address)

// Double-click: glide toward the point, ending a third of the way from it.
let glide = null;
canvas.addEventListener('dblclick', e => {
  if (fly.on) return;
  const hit = groundAt(e.clientX, e.clientY);
  if (!hit) return;
  glide = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), target: hit,
            pos: hit.clone().add(camera.position.clone().sub(hit).multiplyScalar(0.35)) };
});
function glideStep(dt) {
  if (!glide) return;
  glide.t = Math.min(1, glide.t + dt / 0.7);
  const e = 1 - (1 - glide.t) ** 3;  // ease out
  camera.position.lerpVectors(glide.fromPos, glide.pos, e);
  controls.target.lerpVectors(glide.fromTarget, glide.target, e);
  if (glide.t === 1) glide = null;
}

// Keyboard works in both modes. In map mode W A S D slide across the terrain (camera and pivot
// together) at a speed proportional to the distance to the pivot, so it suits any height.
const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyC', 'Space', 'ShiftLeft', 'ShiftRight',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.target.closest?.('input')) return;
  if (MOVE_KEYS.has(e.code)) {
    keys.add(e.code);
    e.preventDefault();  // stop Space scrolling the panel or toggling a focused button
  }
  const factor = { Minus: 1 / 1.25, BracketLeft: 1 / 1.25, Equal: 1.25, BracketRight: 1.25 }[e.code];
  if (factor) {
    fly.speed *= factor;
    flash(`Speed ${(fly.speed / fly.base).toFixed(1)}×`);
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// Map-mode key speed follows the camera's height above the terrain straight below (checked a few
// times a second, eased so it never jumps). Tying it to the pivot distance made it jump whenever a
// drag or scroll re-aimed the pivot at far-off terrain or empty sky.
const down = new THREE.Vector3(0, -1, 0);
let groundHeight = null, lastHeightCheck = 0, mapSpeed = null;
function heightAboveGround() {
  const now = performance.now();
  if (now - lastHeightCheck > 200) {
    lastHeightCheck = now;
    raycaster.set(camera.position, down);
    const hit = raycaster.intersectObjects(visibleMeshes(true), false)[0];
    if (hit) groundHeight = hit.distance;
  }
  return groundHeight ?? camera.position.distanceTo(controls.target);
}

function keyMove(dt) {
  if (!keys.size) return;
  const k = keys, boost = k.has('ShiftLeft') || k.has('ShiftRight') ? 5 : 1;
  const ahead = (k.has('KeyW') || k.has('ArrowUp')) - (k.has('KeyS') || k.has('ArrowDown'));
  const side = (k.has('KeyD') || k.has('ArrowRight')) - (k.has('KeyA') || k.has('ArrowLeft'));
  const up = (k.has('Space') || k.has('KeyE')) - (k.has('KeyQ') || k.has('KeyC'));
  camera.getWorldDirection(forward);
  if (!fly.on) forward.y = 0;  // map mode: slide level with the ground
  forward.normalize();
  right.crossVectors(forward, camera.up).normalize();
  move.set(0, 0, 0).addScaledVector(forward, ahead).addScaledVector(right, side).addScaledVector(camera.up, up);
  if (!move.lengthSq()) return;
  let speed = fly.speed;
  if (!fly.on) {
    const wanted = Math.max(heightAboveGround(), span * 0.0005) * 0.8;
    mapSpeed = mapSpeed === null ? wanted : mapSpeed + (wanted - mapSpeed) * Math.min(1, dt * 2);
    speed = mapSpeed * fly.speed / fly.base;
  }
  move.normalize().multiplyScalar(speed * boost * dt);
  camera.position.add(move);
  if (!fly.on) controls.target.add(move);
}

// Fly mode: drag (or click to capture the mouse) to look; swipes glide.
const flying = () => document.pointerLockElement === canvas;
let drag = null;
canvas.addEventListener('pointerdown', e => { if (fly.on && e.button === 0 && !flying()) drag = { moved: 0 }; });
addEventListener('pointerup', () => {
  // browsers may refuse (e.g. without a real user gesture); dragging still works then
  if (drag && drag.moved < 4) canvas.requestPointerLock()?.catch?.(() => {});
  drag = null;
});
document.addEventListener('pointerlockchange', () => {
  document.getElementById('hint').style.display = flying() ? 'block' : 'none';
});
document.addEventListener('mousemove', e => {
  if (drag) drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  if (!fly.on || !(flying() || drag)) return;
  fly.look.y -= e.movementX * 0.002;
  fly.look.x = Math.max(-1.55, Math.min(1.55, fly.look.x - e.movementY * 0.002));
  camera.quaternion.setFromEuler(fly.look);
});
canvas.addEventListener('wheel', e => {
  if (!fly.on) return;  // map mode zooms toward the cursor (below)
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;  // lines / pages -> pixels
  const step = fly.speed * 0.004 * (e.ctrlKey ? 8 : 1);  // pinch deltas are small
  camera.getWorldDirection(forward);
  right.crossVectors(forward, camera.up).normalize();
  camera.position.addScaledVector(forward, -e.deltaY * unit * step);
  if (!e.ctrlKey) camera.position.addScaledVector(right, e.deltaX * unit * step);
}, { passive: false });

let flashTimer;
function flash(text) {
  status.textContent = text;
  status.dataset.flash = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { delete status.dataset.flash; }, 1200);
}

const HELP = {
  map: '<b>Map:</b> drag to move the ground (it stays under the cursor), scroll or pinch to zoom toward the cursor, right-drag or Shift-drag to rotate and tilt, double-click to fly there. W A S D and Space / Q also move; Shift is faster, − / = set speed.',
  fly: '<b>Fly:</b> W A S D move, Space / Q up and down, Shift is faster, − / = set speed. Two-finger swipe or pinch to glide. Drag to look, or click the view to steer with the mouse (Esc lets go).',
};
function setMode(flyOn) {
  fly.on = flyOn;
  controls.enabled = !flyOn;
  glide = null;
  document.getElementById('mode').textContent = `Camera: ${flyOn ? 'fly' : 'map'}`;
  document.getElementById('help').innerHTML = HELP[flyOn ? 'fly' : 'map'] +
    ' Click a name to jump there. Option-click (or I) shows what something is; the address keeps your view.';
  if (flyOn) {
    fly.look.setFromQuaternion(camera.quaternion);
  } else {
    if (flying()) document.exitPointerLock();
    // pivot on whatever ground is in front of the camera
    controls.target.copy(groundAt(innerWidth / 2, innerHeight / 2) ?? pivotAlongView());
  }
}

// game Z-up -> viewer Y-up, centred and scaled
const toScene = (x, y, z, out, o) => {
  out[o] = (x - center[0]) * SCALE; out[o + 1] = (z - center[1]) * SCALE; out[o + 2] = (-y - center[2]) * SCALE;
};

// ---------- view state and materials ----------
const view = { textures: true, lighting: 'baked', objects: true, panels: true, helpers: false, blocks: false, wire: false };
const allMaterials = new Set();
const track = m => { allMaterials.add(m); m.wireframe = view.wire; return m; };
const pick = mesh => mesh.userData.mats[view.lighting][view.textures ? 'textured' : 'flat'];
const applyMaterials = () => scene.traverse(o => { if (o.isMesh) o.material = pick(o); });

// Four materials per (texture, lightmap, colour): textured or flat, baked or viewer-lit.
const materialCache = new Map();
function materials(t, lm, flatColor, vertexLit, solid) {
  const key = [t?.id, lm?.uuid, flatColor.getHexString(), vertexLit, solid].join(':');
  if (!materialCache.has(key)) {
    // Terrain is always solid: road textures keep a full snow image in their colour channel and
    // use alpha as a mask for some other effect, so treating it as transparency punches holes.
    const blend = !solid && t?.mode === 'blend', cutout = !solid && t?.mode === 'cutout';
    const common = { side: THREE.DoubleSide, transparent: blend, depthWrite: !blend, alphaTest: cutout ? 0.5 : 0 };
    // glow textures (light on black) are added on top, so their black parts vanish
    if (!solid && t?.additive) Object.assign(common, { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const surface = t ? { map: t.tex } : { color: 0xff00ff };
    const flatSurface = { color: flatColor, alphaMap: cutout ? t.tex : null, opacity: blend ? 0.4 : 1 };
    const baked = lm ? { lightMap: lm, lightMapIntensity: BAKED_GAIN * Math.PI }  // unlit materials divide by pi
      : vertexLit ? { vertexColors: true } : {};
    materialCache.set(key, {
      viewer: {
        textured: track(new THREE.MeshStandardMaterial({ ...common, ...surface, roughness: 0.9 })),
        flat: track(new THREE.MeshStandardMaterial({ ...common, ...flatSurface, roughness: 0.9 })),
      },
      baked: {
        textured: track(new THREE.MeshBasicMaterial({ ...common, ...surface, ...baked })),
        flat: track(new THREE.MeshBasicMaterial({ ...common, ...flatSurface, ...baked })),
      },
    });
  }
  return materialCache.get(key);
}

function makeMesh(pos, idx, attrs, mats) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  for (const [name, [array, size]] of Object.entries(attrs)) geo.setAttribute(name, new THREE.BufferAttribute(array, size));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo);
  mesh.userData.mats = mats;
  mesh.material = pick(mesh);
  return mesh;
}
const indexArray = (n, maxVertex) => maxVertex > 65535 ? new Uint32Array(n) : new Uint16Array(n);

// ---------- overview: every location at low detail, coloured like the game ----------
const peakHue = { A: 0.58, B: 0.33, C: 0.08, D: 0.85, E: 0.13 };
const ovPos = overview.section('pos', Int16Array), ovCol = overview.section('col');
const locations = [];
{
  const n = ov.steps + 1, per = n * n;
  const grid = [];
  for (let a = 0; a < ov.steps; a++) for (let b = 0; b < ov.steps; b++) {
    const i = a * n + b, j = i + n;
    grid.push(i, j, j + 1, i, j + 1, i + 1);
  }
  let vert = 0;
  ov.locations.forEach((info, k) => {
    const hue = peakHue[info.name[0]] ?? 0;
    const loc = {

  marker.position.copy(hit.point);
  marker.scale.setScalar(camera.position.distanceTo(hit.point) * 0.006);
  marker.visible = true;
}
function closeInspect() {
  document.getElementById('inspect').hidden = true;
  marker.visible = false;
}
document.getElementById('inspectClose').onclick = closeInspect;

// The view lives in the address (#view=camera xyz,target xyz), so a link reopens the same spot.
function viewHash() {
  return 'view=' + [...camera.position.toArray(), ...controls.target.toArray()].map(v => +v.toFixed(3)).join(',');
}
function applyHash() {
  const m = location.hash.match(/view=([-\d.,e]+)/);
  const v = m?.[1].split(',').map(Number);
  if (!v || v.length !== 6 || v.some(Number.isNaN)) return false;
  camera.position.set(v[0], v[1], v[2]);
  controls.target.set(v[3], v[4], v[5]);
  camera.lookAt(controls.target);
  camera.updateMatrixWorld();
  fly.look.setFromQuaternion(camera.quaternion);
  return true;
}
applyHash();
let lastHash = '';
setInterval(() => {
  const h = viewHash();
  if (h !== lastHash) { lastHash = h; history.replaceState(null, '', '#' + h); }
}, 500);
document.getElementById('copyView').onclick = async () => {
  const text = `${lastInspect}\nView: ${location.href.split('#')[0]}#${viewHash()}`;
  try { await navigator.clipboard.writeText(text); flash('Copied'); }
  catch { prompt('Copy this:', text); }
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  keyMove(dt);
  glideStep(dt);
  if (!fly.on) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
