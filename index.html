<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Junk made by Andrew</title>
    <meta name="description" content="Simulations, games, visualizations and odd tools Andrew Maxwell has made since 2010. Nearly all of them run in your browser.">
    <meta name="theme-color" content="#0f1115">
    <link rel="icon" href="home/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Junk made by Andrew">
    <meta property="og:description" content="Simulations, games, visualizations and odd tools, nearly all running in your browser.">
    <meta property="og:url" content="https://andrewmaxwell.github.io/junk/">
    <meta property="og:image" content="https://andrewmaxwell.github.io/junk/home/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0f1115;
        --surface-color: #1a1d24;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --border-color: #2b303b;
        --accent-color: #3b82f6;
        --gutter: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Ambient Background Glow */
      body::before, body::after {
        content: '';
        position: fixed;
        width: 60vw;
        height: 60vw;
        max-width: 800px;
        max-height: 800px;
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
        pointer-events: none;
        opacity: 0.12;
      }
      body::before {
        top: -20%;
        left: -10%;
        background: #3b82f6;
      }
      body::after {
        bottom: -20%;
        right: -10%;
        background: #8b5cf6;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 var(--gutter) max(60px, env(safe-area-inset-bottom));
      }

      header {
        padding: max(56px, env(safe-area-inset-top)) 0 28px;
        max-width: 720px;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0 0 14px;
        background: linear-gradient(90deg, #f9fafb 30%, #93c5fd 70%, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      #summary {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin: 0 0 14px;
        min-height: 3em;
      }

      .links {
        display: flex;
        gap: 18px;
        font-size: 0.95rem;
      }
      .links a {
        color: #93c5fd;
        text-decoration: none;
      }
      .links a:hover {
        text-decoration: underline;
      }

      .controls {
        display: flex;
        gap: 10px;
        padding: 12px 0;
      }

      .search-wrapper {
        position: relative;
        flex: 1;
        max-width: 560px;
      }

      .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        color: #6b7280;
        pointer-events: none;
        transition: color 0.2s ease;
        z-index: 1;
      }

      .search-wrapper:focus-within .search-icon {
        color: var(--accent-color);
      }

      #searchInput {
        width: 100%;
        padding: 14px 20px 14px 50px;
        border-radius: 100px;
        border: 1px solid var(--border-color);
        background-color: rgba(26, 29, 36, 0.85);
        backdrop-filter: blur(10px);
        color: var(--text-primary);
        font-size: 1rem; /* 16px keeps iOS from zooming in on focus */
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        font-family: inherit;
        box-sizing: border-box;
        -webkit-appearance: none;
      }

      #searchInput::placeholder {
        color: #6b7280;
      }

      #searchInput:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      }

      kbd {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font: 500 0.75rem 'Inter', sans-serif;
        color: #6b7280;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 1px 7px;
        pointer-events: none;
      }
      #searchInput:focus ~ kbd, #searchInput:not(:placeholder-shown) ~ kbd {
        display: none;
      }
      @media (hover: none) {
        kbd { display: none; }
      }

      .surprise {
        flex: none;
        border: 1px solid var(--border-color);
        border-radius: 100px;
        background: rgba(26, 29, 36, 0.85);
        color: var(--text-primary);
        font: 500 0.95rem 'Inter', sans-serif;
        padding: 0 20px;
        min-height: 48px;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .surprise:hover {
        border-color: var(--accent-color);
        background: rgba(59, 130, 246, 0.15);
      }
      .surprise::before {
        content: '🎲 ';
      }

      section {
        margin-top: 28px;
      }

      h2 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 14px;
        letter-spacing: -0.01em;
      }
      h2 span {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-left: 6px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }

      .message {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-top: 40px;
      }
      .message .surprise {
        margin-left: 8px;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .item {
        text-decoration: none;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        display: flex;
        flex-direction: column;
        position: relative;
        background: radial-gradient(120% 120% at 50% -20%, #1a1d24 0%, #0c0d12 100%);
        -webkit-tap-highlight-color: transparent;
      }

      .item.entering {
        opacity: 0;
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .image-container {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16/10;
        background-color: #0b0c0f;
        border-bottom: 1px solid var(--border-color);
      }

      .item img, .item video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: opacity 0.4s ease, transform 0.5s ease;
      }

      .item img {
        opacity: 0;
      }
      .item img.loaded {
        opacity: 1;
      }

      .item video {
        opacity: 0;
      }
      .item video.playing {
        opacity: 1;
      }

      .item-content {
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      /* Animated glow line on hover */
      .item::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      @media (hover: hover) {
        .item:hover {
          transform: translateY(-6px);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.15);
          border-color: rgba(59, 130, 246, 0.4);
          z-index: 10;
        }
        .item:hover img, .item:hover video {
          transform: scale(1.04);
        }
        .item:hover::after {
          opacity: 1;
        }
        .item:hover .desc {
          color: #d1d5db;
        }
      }
      .item:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 3px;
      }

      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        gap: 12px;
      }

      .item strong {
        font-size: 1.15rem;
        font-weight: 600;
        color: #f9fafb;
        line-height: 1.3;
      }

      .year-badge {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.06);
        padding: 4px 10px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        white-space: nowrap;
      }

      .desc {
        color: var(--text-secondary);
        font-size: 0.95em;
        line-height: 1.5;
        transition: color 0.3s ease;
      }

      .snippet {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
        color: #6b7280;
        font-size: 0.85em;
      }

      mark {
        background: rgba(59, 130, 246, 0.3);
        color: inherit;
        border-radius: 3px;
        padding: 0 1px;
      }

      /* phones: two small columns so there's more to see per screen */
      @media (max-width: 600px) {
        :root {
          --gutter: max(12px, env(safe-area-inset-left), env(safe-area-inset-right));
        }
        header {
          padding-top: max(32px, env(safe-area-inset-top));
          padding-bottom: 16px;
        }
        #summary {
          font-size: 0.95rem;
        }
        .surprise {
          padding: 0 16px;
          font-size: 0;
        }
        .surprise::before {
          font-size: 1.2rem;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .item {
          border-radius: 12px;
        }
        .item-content {
          padding: 10px 12px 12px;
        }
        .title-row {
          margin-bottom: 4px;
          flex-direction: column;
          gap: 4px;
          align-items: flex-start;
        }
        .item strong {
          font-size: 0.95rem;
        }
        .year-badge {
          font-size: 0.7rem;
          padding: 1px 7px;
        }
        .desc {
          font-size: 0.8rem;
          line-height: 1.4;
        }
        .snippet {
          font-size: 0.75rem;
        }
        h2 {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Junk made by Andrew</h1>
        <p id="summary"></p>
        <nav class="links">
          <a href="https://github.com/andrewmaxwell/junk">Source on GitHub</a>
          <a href="https://www.codewars.com/users/andrewmaxwell">Codewars</a>
        </nav>
      </header>
      <div class="controls">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="searchInput" placeholder="Search, e.g. WebGPU, game, fluid" aria-label="Search projects" autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <button class="surprise" type="button" aria-label="Open a random project" title="Open a random project">Surprise me</button>
      </div>
      <div id="projectContainer"></div>
    </main>

    <script type="module" src="home/main.js"></script>
  </body>
</html>
